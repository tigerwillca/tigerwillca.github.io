<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Our Family Legacy</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#ffeed6;font-family:Georgia,serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:manipulation}.label{position:fixed;left:50%;top:70%;transform:translateX(-50%);text-align:center;pointer-events:none;text-shadow:0 0 20px #ffb464}.name{font-size:clamp(30px,4vw,48px);letter-spacing:.06em}.full{margin-top:5px;font:13px ui-monospace,monospace;letter-spacing:.15em;opacity:.55}.phrase{margin-top:16px;font-style:italic;opacity:.6}.people{position:fixed;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));text-align:center}.signal{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom));text-align:center;font:italic 12px Georgia,serif;letter-spacing:.06em}.signal a{color:#ffeed6;opacity:.42;text-decoration:none;text-shadow:0 0 12px #ffb464}.signal a:hover{opacity:.8}.door p{margin:0;font-size:15px;font-style:italic;opacity:.65;text-align:center}.people button{margin:0 4px;min-height:44px;padding:8px 10px;background:none;border:0;color:#ffeed666;font:14px Georgia,serif;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.people button:hover,.people button[aria-pressed=true]{color:#ffeed6;text-shadow:0 0 12px #ffc478}.legacy{position:fixed;left:0;right:0;top:calc(22px + env(safe-area-inset-top));text-align:center;font:11px Georgia,serif;letter-spacing:.42em;text-transform:uppercase;color:#ffeed6;opacity:.38;pointer-events:none;text-shadow:0 0 14px #ffb464}.fallback{position:fixed;inset:0;display:grid;place-items:center}.door{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#000;color:#ffeed6;font-family:Georgia,serif;transition:opacity .45s}.door.show{display:flex}.door h1{margin:0 0 8px;font:12px Georgia,serif;letter-spacing:.42em;text-transform:uppercase;font-weight:normal;opacity:.7;text-shadow:0 0 14px #ffb464}.door form{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(280px,100%)}.door input{box-sizing:border-box;width:100%;min-height:44px;padding:10px 12px;background:#000;border:1px solid #ffeed655;border-radius:6px;color:#ffeed6;font:16px Georgia,serif;text-align:center;outline:none}.door input:focus{border-color:#ffeed6aa}.door input::placeholder{color:#ffeed666}.door button{min-height:44px;min-width:120px;padding:10px 20px;background:none;border:1px solid #ffeed688;border-radius:6px;color:#ffeed6;font:16px Georgia,serif;letter-spacing:.08em;cursor:pointer;touch-action:manipulation}.door button:disabled{opacity:.5}.door-err{min-height:20px;font-size:14px;font-style:italic;opacity:.7}
</style>
</head>
<body>
<canvas id="c" aria-label="A figure made of light"></canvas>
<div class="legacy">Our family legacy</div>
<div class="label"><div class="name" id="name"></div><div class="full" id="full"></div><div class="phrase" id="phrase"></div></div>
<nav id="people" class="people" aria-label="People"></nav>
<div class="signal"><a href="/signal/" rel="noreferrer">every thread leads back to signal ✦</a></div>
<div id="door" class="door"><h1>Our family legacy</h1><p>Enter the family word to see the lights.</p><form id="door-form" autocomplete="off"><input id="door-word" type="text" placeholder="Family word" aria-label="Family word" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go"><button id="door-btn" type="submit">Enter</button></form><div id="door-err" class="door-err" role="status"></div></div>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var L = window.CONNECTION_LOCK, KEY = 'pulse-family', door = document.getElementById('door'), form = document.getElementById('door-form'), inp = document.getElementById('door-word'), btn = document.getElementById('door-btn'), err = document.getElementById('door-err');
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function unlock(w) { var s = crypto.subtle; return s.importKey('raw', new TextEncoder().encode(w), 'PBKDF2', false, ['deriveKey']).then(function (k) { return s.deriveKey({name:'PBKDF2', hash:'SHA-256', salt:b64(L.salt), iterations:L.iter}, k, {name:'AES-GCM', length:256}, false, ['decrypt']); }).then(function (k) { return s.decrypt({name:'AES-GCM', iv:b64(L.iv)}, k, b64(L.ct)); }).then(function (p) { return JSON.parse(new TextDecoder().decode(p)); }); }
  function getStored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function setStored(w) { try { if (w == null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, w); } catch (e) {} }
  var urlWord = null, rest = [];
  location.hash.slice(1).split('&').forEach(function (p) { if (p.indexOf('k=') === 0) urlWord = decodeURIComponent(p.slice(2)).trim().toLowerCase(); else if (p) rest.push(p); });
  var stored = getStored();
  function enter(cfg, w, fade) {
    window.CONNECTION_CONFIG = cfg; setStored(w);
    if (urlWord !== null) history.replaceState(null, '', location.pathname + location.search + (rest.length ? '#' + rest.join('&') : ''));
    function load() { door.style.display = 'none'; var s = document.createElement('script'); s.src = 'app.js'; document.body.appendChild(s); }
    if (fade) { door.style.opacity = '0'; setTimeout(load, 450); } else load();
  }
  function showDoor() { door.classList.add('show'); }
  function attempt(list) {
    if (!list.length) return showDoor();
    var w = list.shift();
    unlock(w).then(function (c) { enter(c, w, false); }, function () { if (w === stored) setStored(null); attempt(list); });
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault(); var w = inp.value.trim().toLowerCase(); if (!w) return;
    err.textContent = ''; btn.disabled = true;
    unlock(w).then(function (c) { enter(c, w, true); }, function () { err.textContent = 'That\u2019s not it. Try again, slowly.'; btn.disabled = false; inp.select(); });
  });
  var list = []; if (urlWord) list.push(urlWord); if (stored && stored !== urlWord) list.push(stored);
  attempt(list);
})();
</script>
</body>
</html>
