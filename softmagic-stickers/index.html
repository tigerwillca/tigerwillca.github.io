<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f5f7">
<title>SoftMagic Stickers</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html,body { margin:0; background:#f5f5f7; color:#1d1d1f;
    font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; }
  main { max-width:720px; margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 48px); }
  h1 { font:700 34px/1.15 -apple-system,system-ui,sans-serif; letter-spacing:-.02em; margin:0 0 6px; }
  .lead { color:#6e6e73; margin:0 0 8px; font-size:17px; }
  .how { background:#fff; border-radius:18px; padding:14px 16px; margin:16px 0 22px;
    box-shadow:0 1px 3px rgba(0,0,0,.06); color:#3a3a3c; font-size:15px; }
  .how b { color:#1d1d1f; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  @media (min-width:560px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  figure { margin:0; background:#fff; border-radius:22px; padding:14px 10px 10px;
    box-shadow:0 1px 3px rgba(0,0,0,.06); text-align:center; }
  img { width:100%; height:auto; aspect-ratio:1; object-fit:contain;
    -webkit-touch-callout:default; user-select:none; background:
    radial-gradient(circle at 50% 40%, #fff 0%, #f0f0f2 100%); border-radius:16px; }
  figcaption { margin-top:8px; font-size:12px; color:#6e6e73; text-transform:capitalize; }
  .top { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0 4px; }
  button, .pill { font:600 15px -apple-system,system-ui,sans-serif; border:0; border-radius:980px;
    padding:10px 16px; background:#0071e3; color:#fff; text-decoration:none; display:inline-block; cursor:pointer; }
  button.secondary, a.secondary { background:#e8e8ed; color:#1d1d1f; }
  #msg { min-height:1.2em; font-size:14px; color:#6e6e73; margin:8px 0 0; }
  footer { margin-top:28px; color:#8e8e93; font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>SoftMagic Stickers</h1>
  <p class="lead">Apple-simple SoftMagic set. Press and hold any sticker to save.</p>
  <div class="top">
    <button id="share">Share link</button>
    <a class="pill secondary" href="SoftMagic-Apple-Simple.zip">Download zip</a>
  </div>
  <div id="msg"></div>
  <div class="how">
    <b>iPhone:</b> press and hold a sticker → Save to Photos → in Photos, press and hold → Add Sticker.
  </div>
  <div class="grid" id="grid"></div>
  <footer>SoftMagic · Soft7 art only · Hood IG included</footer>
</main>
<script>
const U='https://tigerwillca.github.io/softmagic-stickers/';
const files=["SoftMagic-Hood-IG.gif", "SoftMagic-Hood-IG.png", "SoftMagic-Owl-loop.gif", "SoftMagic-Phoenix-loop.gif", "SoftMagic-Tiger-loop.gif", "SoftMagic-Fox-pulse.png", "SoftMagic-Merlin-pulse.png", "SoftMagic-Metatron-pulse.png", "SoftMagic-swirl-loop.png", "SoftMagic-spin.png", "SoftMagic-pattern-rainbow-pulse.png", "SoftMagic-pattern-gold-pulse.png", "SoftMagic-rgb-knot-01.png", "SoftMagic-rgb-knot-02.png", "SoftMagic-rgb-knot-03.png", "SoftMagic-rgb-knot-04.png", "SoftMagic-rgb-knot-05.png", "SoftMagic-rgb-knot-spin.gif", "Soft7-Owl.png", "Soft7-Phoenix.png", "Soft7-Tiger.png", "SoftMagic-pattern-1-magenta.png", "SoftMagic-pattern-2-cyan.png", "SoftMagic-pattern-3-gold.png", "SoftMagic-pattern-8-rainbow-ring.png"];
const g=document.getElementById('grid');
for(const name of files){
  const label=name.replace(/^SoftMagic-|^Soft7-/,'').replace(/\.(gif|png)$/,'').replace(/-/g,' ');
  const f=document.createElement('figure');
  f.innerHTML=`<img src="assets/${name}" alt="${label}" loading="lazy"><figcaption>${label}</figcaption>`;
  g.appendChild(f);
}
document.getElementById('share').onclick=async()=>{
  const m=document.getElementById('msg');
  if(navigator.share){try{await navigator.share({title:'SoftMagic Stickers',url:U});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(U);m.textContent='Link copied.'}catch(e){m.textContent=U}
};
</script>
</body>
</html>
