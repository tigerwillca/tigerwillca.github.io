<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SoftMagic Stickers — soft magic</title>
<style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0b0614;color:#f5e9ff}
header{padding:28px 20px 12px;text-align:center}
h1{margin:0;font-size:1.6rem;letter-spacing:.02em}
p{opacity:.85;max-width:560px;margin:10px auto}
a.btn{display:inline-block;margin:12px 6px;padding:12px 18px;border-radius:999px;background:linear-gradient(135deg,#9b2fff,#ff7ad9);color:#fff;text-decoration:none;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:16px 18px 40px;max-width:980px;margin:0 auto}
.card{background:#160a28;border:1px solid #3a1f5c;border-radius:18px;padding:10px;text-align:center}
.card img{width:100%;height:auto;border-radius:50%;background:#000}
.card .n{font-size:.72rem;margin-top:8px;word-break:break-all;opacity:.8}
</style></head><body>
<header>
<h1>SoftMagic · Apple-simple</h1>
<p>Every sticker says <b>soft magic</b>. GIF + image. Gucci-glasses IG self-portrait + Hood IG included.</p>
<a class="btn" href="SoftMagic-Apple-Simple.zip">Download all (zip)</a>
<a class="btn" href="HOW-TO.txt">How to add on iPhone</a>
</header>
<div class="grid" id="g"></div>
<script>
const files=["SoftMagic-IG-Gucci.gif", "SoftMagic-IG-Gucci.png", "SoftMagic-Hood-IG.gif", "SoftMagic-Hood-IG.png", "SoftMagic-Owl-loop.gif", "SoftMagic-Phoenix-loop.gif", "SoftMagic-Tiger-loop.gif", "SoftMagic-Fox-pulse.png", "SoftMagic-Merlin-pulse.png", "SoftMagic-Metatron-pulse.png", "SoftMagic-swirl-loop.png", "SoftMagic-spin.png", "SoftMagic-pattern-rainbow-pulse.png", "SoftMagic-pattern-gold-pulse.png", "SoftMagic-rgb-knot-01.png", "SoftMagic-rgb-knot-02.png", "SoftMagic-rgb-knot-03.png", "SoftMagic-rgb-knot-04.png", "SoftMagic-rgb-knot-05.png", "SoftMagic-rgb-knot-spin.gif", "Soft7-Owl.png", "Soft7-Phoenix.png", "Soft7-Tiger.png", "SoftMagic-pattern-1-magenta.png", "SoftMagic-pattern-2-cyan.png", "SoftMagic-pattern-3-gold.png", "SoftMagic-pattern-8-rainbow-ring.png"];
const g=document.getElementById('g');
for(const f of files){
  const c=document.createElement('div'); c.className='card';
  const img=document.createElement('img'); img.src='assets/'+f; img.alt=f; img.loading='lazy';
  const n=document.createElement('div'); n.className='n'; n.textContent=f;
  c.appendChild(img); c.appendChild(n); g.appendChild(c);
}
</script>
</body></html>
