<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Soft7 · Reynard on Robinhood Chain</title>
<style>
  :root { color-scheme: dark; --lime:#CCFF00; --gold:#E6B85C; --gold-hi:#F6DFA0; --gold-glow:rgba(230,184,92,.35); --gold-soft:rgba(230,184,92,.14); --ember:#ff7a2a; --muted:#a79bbd; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:#06040c; color:#ece6f6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
  body { min-height:100vh; overflow-x:hidden;
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M16 2c3 6 9 8 9 15a9 9 0 0 1-18 0c0-4 2-6 4-8 0 3 1 5 3 6-1-5 0-9 2-13z' fill='%23ff7a2a'/><path d='M16 13c2 3 4 4 4 7a4 4 0 0 1-8 0c0-2 1-3 2-4 0 1 1 2 2 2-1-2 0-4 0-5z' fill='%23CCFF00'/></svg>") 16 16, auto; }
  .bg-poster, .bgvid { position:fixed; inset:0; width:100%; height:100%; z-index:0; object-fit:cover; object-position:50% 35%; pointer-events:none; }
  .bg-poster { background:#06040c url("assets/phoenix-poster.jpg") 50% 35% / cover no-repeat; }
  #sky { position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; pointer-events:none; }
  .veil { position:fixed; inset:0; z-index:1; pointer-events:none;
    background: radial-gradient(ellipse 60% 45% at 50% 35%, rgba(255,122,42,.10), transparent 60%),
                linear-gradient(180deg, rgba(6,4,12,.45), rgba(6,4,12,.35) 35%, rgba(6,4,12,.62) 70%, rgba(6,4,12,.82)); }
  @media (prefers-reduced-motion: reduce) { .bgvid, #sky { display:none; } }
  main { position:relative; z-index:2; width:min(100% - 2rem, 64rem); margin:0 auto; padding:14vh 0 4rem; text-align:center; }
  .badge { display:inline-block; font:600 .7rem ui-monospace, Menlo, monospace; letter-spacing:.18em; text-transform:uppercase;
    color:var(--lime); border:1px solid rgba(204,255,0,.35); border-radius:999px; padding:.4rem .9rem; background:rgba(204,255,0,.06); }
  h1 { margin:1rem 0 .4rem; font-weight:500; font-size:clamp(2.4rem, 9vw, 4.6rem); letter-spacing:-.04em; color:var(--gold);
    text-shadow:0 0 30px var(--gold-glow); }
  .lede { color:var(--muted); max-width:34rem; margin:0 auto 1.8rem; line-height:1.6; text-shadow:0 1px 3px rgba(6,4,12,.9), 0 0 14px rgba(6,4,12,.8); }
  .hero-img { display:block; width:100%; max-width:720px; aspect-ratio:4/5; max-height:78vh; object-fit:cover; object-position:50% 30%;
    margin:2rem auto 0; border-radius:16px; border:1px solid var(--gold-glow); box-shadow:0 0 30px var(--gold-soft); background:#0b0716; }
  .cta { display:inline-block; text-decoration:none; color:#06040c; background:var(--lime); font-weight:600;
    padding:.9rem 1.5rem; border-radius:999px; box-shadow:0 0 26px rgba(204,255,0,.25); cursor:inherit; }
  .grid { margin:22vh auto 0; display:grid; grid-template-columns:repeat(7, 1fr); gap:.7rem; }
  @media (max-width: 760px) { .grid { grid-template-columns:repeat(4, 1fr); } }
  @media (max-width: 440px) { .grid { grid-template-columns:repeat(2, 1fr); } }
  .card { display:block; text-decoration:none; color:var(--muted); cursor:inherit; opacity:0; transform:translateY(18px);
    animation: rise .9s ease-out forwards; }
  .card img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; border:1px solid var(--gold-glow);
    box-shadow:0 0 18px var(--gold-soft); background:#0b0716; transition:transform .2s, box-shadow .2s; }
  .card:hover img { transform:translateY(-3px); box-shadow:0 0 26px rgba(204,255,0,.25); }
  .card span { display:block; font:.72rem ui-monospace, Menlo, monospace; margin-top:.35rem; }
  @keyframes rise { to { opacity:1; transform:none; } }
  .manifesto { margin:3rem 0 0; font-size:.95rem; letter-spacing:.08em; color:var(--gold-hi); opacity:0;
    animation: sig 1.2s ease-out forwards, glowfade 3s ease-out forwards; animation-delay: 6.8s, 6.8s; }
  @keyframes sig { to { opacity:1; } }
  @keyframes glowfade { 0% { text-shadow:0 0 18px var(--gold-glow); } 100% { text-shadow:0 0 0 rgba(230,184,92,0); } }
  .contract { margin-top:1.4rem; font:.72rem ui-monospace, Menlo, monospace; color:#8d82a3; word-break:break-all; text-shadow:0 1px 3px rgba(6,4,12,.9); }
  .contract a { color:var(--gold); cursor:inherit; }
  .countdown { margin:22vh 0 0; font:600 .8rem ui-monospace, Menlo, monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); text-shadow:0 1px 3px rgba(6,4,12,.9), 0 0 14px var(--gold-glow); min-height:1.2em; }
  .countdown + .grid { margin-top:1.4rem; }
  .card.sealed .seal { width:100%; aspect-ratio:1; border-radius:10px; border:1px dashed var(--gold-glow); background:radial-gradient(circle at 50% 40%, rgba(230,184,92,.12), #0b0716 70%); display:flex; align-items:center; justify-content:center; }
  .card.sealed .seal b { font-weight:500; font-size:1.6rem; color:var(--gold); opacity:.8; }
</style>
</head>
<body>
<div class="bg-poster" aria-hidden="true"></div>
<video class="bgvid" autoplay muted loop playsinline preload="auto" poster="assets/phoenix-poster.jpg" aria-hidden="true">
  <source src="assets/phoenix.webm" type="video/webm" />
  <source src="assets/phoenix.mp4" type="video/mp4" />
</video>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<main>
  <div class="badge">7 of 7 · Robinhood Chain</div>
  <h1>Soft7</h1>
  <p class="lede">Seven Reynard cards. A small first circle, built to give back.</p>
  <a class="cta" href="https://opensea.io/collection/reynard-soft7">See Soft7 on OpenSea</a>
  <img class="hero-img" src="assets/phoenix-poster.jpg" alt="Reynard Soft7 phoenix" width="720" height="1280" />

  <p class="countdown" id="countdown" aria-live="polite"></p>
  <section class="grid" aria-label="The seven Soft7 cards" id="grid"></section>

  <p class="manifesto">Seven pieces. Seven holders. One treasury.</p>
  <p class="contract">Contract <a href="https://robinhoodchain.blockscout.com/address/0x73D7b2611509C14078e16f572bE5aC7D91879DC2">0x73D7b2611509C14078e16f572bE5aC7D91879DC2</a></p>
</main>
<script>
(function(){
  var IMG='https://cdn.jsdelivr.net/gh/tigerwillca/reynard-soft7-sepolia@ae7d304699989b945bfe8c0f4225f3a7fc952f83/images/';
  var T0=Date.UTC(2026,8,30,2,0,0); // 7:00 PM PT, Tue Sep 29 2026
  var MIN=60000;
  var g=document.getElementById('grid'), cd=document.getElementById('countdown');
  var cards=[], opened=[], done=0;
  function at(i){ return T0+(i-1)*MIN; }
  function label(i){ return '7:0'+(i-1)+' PM PT'; }
  function reveal(i, delay){
    if (opened[i]) return; opened[i]=true; var el=cards[i];
    var a=document.createElement('a'); a.className='card';
    a.href='https://opensea.io/collection/reynard-soft7';
    a.style.animationDelay=delay+'s';
    var img=document.createElement('img'); img.alt='Reynard Soft7 #'+i;
    img.src=IMG+String(32+i).padStart(3,'0')+'.jpg';
    var s=document.createElement('span'); s.textContent='Soft7 #'+i;
    a.appendChild(img); a.appendChild(s);
    g.replaceChild(a, el); cards[i]=a; done++;
  }
  for (var i=1;i<=7;i++){
    var d=document.createElement('div'); d.className='card sealed';
    d.style.animationDelay=(1.2+i*0.7)+'s';
    d.innerHTML='<div class="seal"><b>'+i+'</b></div><span>'+label(i)+'</span>';
    d.setAttribute('aria-label','Soft7 #'+i+' arrives at '+label(i));
    g.appendChild(d); cards[i]=d;
  }
  var first=true;
  function pad(n){ return (n<10?'0':'')+n; }
  function tick(){
    var now=Date.now();
    for (var i=1;i<=7;i++){ if (now>=at(i)) reveal(i, first ? (1.2+i*0.7) : 0); }
    first=false;
    if (cd){
      if (done>=7){ cd.style.display='none'; }
      else if (now<T0){ var r=Math.floor((T0-now)/1000);
        cd.textContent='The seven arrive at 7:00 PM PT \u00b7 '+pad(Math.floor(r/3600))+':'+pad(Math.floor(r%3600/60))+':'+pad(r%60); }
      else { var nx=done+1, r2=Math.max(0,Math.ceil((at(nx)-now)/1000));
        cd.textContent='Card '+nx+' of 7 in '+Math.floor(r2/60)+':'+pad(r2%60); }
    }
    if (done<7) setTimeout(tick, 1000);
  }
  tick();
})();
(function(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var v=document.querySelector('.bgvid'); if (v) { v.removeAttribute('autoplay'); v.pause(); }
    return;
  }
  var c=document.getElementById('sky'), x=c.getContext('2d');
  var dpr=Math.min(window.devicePixelRatio||1,2), w, h, t=0, embers=[];
  function size(){ w=innerWidth; h=innerHeight; c.width=w*dpr; c.height=h*dpr; c.style.width=w+'px'; c.style.height=h+'px'; x.setTransform(dpr,0,0,dpr,0,0); }
  function ember(){ return { x: w/2+(Math.random()-.5)*w*0.5, y: h+10, vy: .6+Math.random()*1.6, vx:(Math.random()-.5)*.4,
    r: .8+Math.random()*2.2, life: 1, hue: Math.random()<.2 ? 'lime':'fire' }; }
  function frame(){
    t+=0.016;
    x.clearRect(0,0,w,h);
    if (Math.random()<.5) embers.push(ember());
    for (var i=embers.length-1;i>=0;i--){ var p=embers[i]; p.y-=p.vy; p.x+=p.vx; p.life-=0.008;
      if (p.life<=0||p.y<-10){ embers.splice(i,1); continue; }
      x.fillStyle = p.hue==='lime' ? 'rgba(204,255,0,'+(p.life*0.6)+')' : 'rgba(255,140,60,'+(p.life*0.7)+')';
      x.beginPath(); x.arc(p.x,p.y,p.r,0,Math.PI*2); x.fill(); }
    if (embers.length>600) embers.splice(0, embers.length-600);
    requestAnimationFrame(frame);
  }
  addEventListener('resize', size); size(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
