<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140804">
<title>Ember stickers</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html,body{margin:0;background:#140804;color:#ffd9a8;font:17px/1.45 -apple-system,system-ui,sans-serif}
  body{background:radial-gradient(ellipse at 50% 0%,#3a1606 0%,#1c0a04 45%,#120603 100%) fixed;min-height:100vh}
  main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 40px);text-align:center}
  h1{font:600 56px/1.1 Georgia,'Times New Roman',serif;margin:8px 0 6px;color:#ffd596;text-shadow:0 0 28px rgba(255,140,40,.45)}
  .lead{font-size:20px;color:#ffe2bb;margin:10px 0 18px}
  img{display:block;width:min(88vw,420px);height:auto;margin:6px auto 18px;-webkit-touch-callout:default}
  .note{font-size:15px;color:rgba(255,205,150,.75);margin:6px 0 24px}
  button{font:600 19px -apple-system,system-ui,sans-serif;color:#2a0e02;background:linear-gradient(#ffcf7a,#ff9a3c);
    border:0;border-radius:28px;padding:15px 34px;box-shadow:0 0 24px rgba(255,130,40,.4);cursor:pointer}
  #msg{min-height:1.4em;font-size:15px;color:#ffc98a;margin:10px 0}
  a{color:#ffb870}
</style>
</head>
<body>
<main>
  <h1>Ember</h1>
  <p class="lead">Press and hold a picture, then tap <b>Save to Photos</b></p>
  <img src="emoji/ember-neutral-512.png" alt="Ember">
  <img src="emoji/ember-happy-512.png" alt="Happy Ember">
  <img src="emoji/ember-sleepy-512.png" alt="Sleepy Ember">
  <p class="note">Make it a Messages sticker: in Photos, press and hold the flame, then tap <b>Add Sticker</b> (iOS 17 or newer).</p>
  <button id="share">Share Ember</button>
  <div id="msg"></div>
  <p><a href="./">Back to Ember</a></p>
</main>
<script>
  const U='https://tigerwillca.github.io/ember/', m=document.getElementById('msg');
  document.getElementById('share').onclick=async()=>{
    if(navigator.share){try{await navigator.share({title:'Ember',url:U});return}catch(e){if(e&&e.name==='AbortError')return}}
    try{await navigator.clipboard.writeText(U);m.textContent='Link copied. Paste it in a message.'}
    catch(e){m.textContent=U}
  };
</script>
</body>
</html>
