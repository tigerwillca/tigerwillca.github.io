<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ember">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ember</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;display:block}
  #hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 42px);text-align:center;
    font:300 13px/1.4 -apple-system,system-ui,sans-serif;letter-spacing:.25em;color:rgba(255,200,140,.35);
    transition:opacity 3s;pointer-events:none}
  #feed{position:fixed;right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 18px);
    width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,170,90,.18);background:transparent;
    color:rgba(255,170,90,.35);font-size:15px;line-height:32px;padding:0;opacity:.5;transition:all .8s}
  #feed.on{border-color:rgba(255,150,60,.55);color:rgba(255,190,110,.9);box-shadow:0 0 18px rgba(255,120,40,.35);opacity:.9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">touch</div>
<button id="feed" aria-label="warm">&#9788;</button>
<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint'), feedBtn = document.getElementById('feed');
let W = 0, H = 0, DPR = 1;
function resize(){ DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize); resize();

/* ---------- smooth value noise (no libraries) ---------- */
const P = new Uint8Array(512); { const p=[...Array(256).keys()]; for(let i=255;i>0;i--){const j=(Math.random()*(i+1))|0;[p[i],p[j]]=[p[j],p[i]];} for(let i=0;i<512;i++)P[i]=p[i&255]; }
const fade=t=>t*t*t*(t*(t*6-15)+10), lerp=(a,b,t)=>a+(b-a)*t;
function grad(h,x,y){ switch(h&3){case 0:return x+y;case 1:return -x+y;case 2:return x-y;default:return -x-y;} }
function noise(x,y){ const X=Math.floor(x)&255,Y=Math.floor(y)&255; x-=Math.floor(x); y-=Math.floor(y);
  const u=fade(x),v=fade(y),a=P[X]+Y,b=P[X+1]+Y;
  return lerp(lerp(grad(P[a],x,y),grad(P[b],x-1,y),u),lerp(grad(P[a+1],x,y-1),grad(P[b+1],x-1,y-1),u),v); }

/* ---------- memory: it remembers you (stored only on this phone) ---------- */
const KEY='ember.v1', DAY=86400000;
const mem = JSON.parse(localStorage.getItem(KEY) || '{"days":[],"last":0,"born":0}');
const now0 = Date.now(), today = new Date().toDateString();
const awayDays = mem.last ? (now0 - mem.last)/DAY : 0;
if(!mem.born) mem.born = now0;
if(!mem.days.includes(today)) mem.days.push(today);
if(mem.days.length > 365) mem.days = mem.days.slice(-365);
const firstVisit = mem.days.length === 1 && !mem.last;
function saveMem(){ mem.last = Date.now(); localStorage.setItem(KEY, JSON.stringify(mem)); }
saveMem(); setInterval(saveMem, 60000); addEventListener('pagehide', saveMem);
// bond grows with each day visited; a week away cools it and it warms up slowly
const bond = Math.min(1, 0.45 + mem.days.length*0.045);
const lonely = awayDays > 7 ? Math.min(1, (awayDays-7)/14 + 0.5) : 0;
const warmupSecs = lonely ? 14 + lonely*10 : (firstVisit ? 5 : 3);
if(!firstVisit) hint.style.opacity = 0;

/* ---------- state ---------- */
const S = {
  x: W/2, y: H*0.56, vx:0, vy:0,          // body position (spring)
  sx:0, sy:0, svx:0, svy:0,               // slosh offset from tilt
  gx:0, gy:1,                             // gravity direction (screen space)
  touch:null, holdStart:0, holdX:0, holdY:0, beating:false, nextBeat:0, pulse:0,
  blink:0, nextBlink: performance.now()+2500, look:{x:0,y:0},
  warm: false, warmAmt: 0, wake: 0, startle:0,
};
const T0 = performance.now();

/* night: dimmer, slower breathing (by the phone's own clock) */
function nightAmount(){ const d=new Date(), h=d.getHours()+d.getMinutes()/60;
  if(h>=22.5||h<5.5) return 1; if(h>=20.5) return (h-20.5)/2; if(h<7.5) return 1-(h-5.5)/2; return 0; }

/* ---------- particle flame ---------- */
const sprite = document.createElement('canvas'); sprite.width = sprite.height = 64;
{ const g=sprite.getContext('2d'), r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.25,'rgba(255,255,255,.55)');
  r.addColorStop(.6,'rgba(255,255,255,.12)'); r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r; g.fillRect(0,0,64,64); }
const tinted = {}; // cache sprites per color bucket
function tint(r,g,b){ const k=(r>>3)+','+(g>>3)+','+(b>>3); if(tinted[k]) return tinted[k];
  const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  x.drawImage(sprite,0,0); x.globalCompositeOperation='source-in'; x.fillStyle=`rgb(${r},${g},${b})`; x.fillRect(0,0,64,64);
  return tinted[k]=c; }
const N = 170, parts = [];
function spawn(p, t){ const a=Math.random()*Math.PI*2, rr=Math.random()**0.6*20;
  p.x=S.x+S.sx+Math.cos(a)*rr; p.y=S.y+S.sy+Math.sin(a)*rr*0.6;
  p.vx=(Math.random()-.5)*0.25; p.vy=(Math.random()-.5)*0.25;
  p.life=0; p.max=0.9+Math.random()*1.6; p.size=8+Math.random()*13; p.seed=Math.random()*100; }
for(let i=0;i<N;i++){ const p={}; spawn(p); p.life=Math.random()*p.max; parts.push(p); }

/* ---------- touch: curious, a little shy ---------- */
let motionAsked = false;
function askMotion(){ if(motionAsked) return; motionAsked = true;
  const D = window.DeviceMotionEvent;
  if(D && typeof D.requestPermission === 'function'){ D.requestPermission().then(s=>{ if(s==='granted') listenMotion(); }).catch(()=>{}); }
  else listenMotion(); }
function listenMotion(){ addEventListener('devicemotion', e => { const a=e.accelerationIncludingGravity; if(!a||a.x==null) return;
  // portrait screen space: x right, y down
  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  let gx = -a.x, gy = a.y; // iOS reports opposite sign of Android; normalize below
  if(/Android/i.test(navigator.userAgent)){ gx = a.x; gy = -a.y; }
  if(ang===90){ [gx,gy]=[-gy,gx]; } else if(ang===-90||ang===270){ [gx,gy]=[gy,-gx]; } else if(ang===180){ gx=-gx; gy=-gy; }
  const m = Math.hypot(gx,gy) || 1; S.gx += ((gx/m) - S.gx)*0.15; S.gy += ((gy/m) - S.gy)*0.15;
  const jolt = Math.abs((e.acceleration&&e.acceleration.x)||0)+Math.abs((e.acceleration&&e.acceleration.y)||0);
  if(jolt > 6) S.startle = Math.min(1, S.startle + jolt/30);
 }); }
function down(e){ e.preventDefault(); askMotion(); const t=e.touches?e.touches[0]:e;
  S.touch={x:t.clientX,y:t.clientY}; S.holdStart=performance.now(); S.holdX=t.clientX; S.holdY=t.clientY;
  hint.style.opacity=0; }
function move(e){ if(!S.touch) return; e.preventDefault(); const t=e.touches?e.touches[0]:e;
  S.touch.x=t.clientX; S.touch.y=t.clientY;
  if(Math.hypot(t.clientX-S.holdX,t.clientY-S.holdY)>14){ S.holdStart=performance.now(); S.holdX=t.clientX; S.holdY=t.clientY; S.beating=false; } }
function up(){ S.touch=null; S.beating=false; }
cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false});
cv.addEventListener('touchend',up); cv.addEventListener('touchcancel',up);
cv.addEventListener('mousedown',down); addEventListener('mousemove',e=>{ if(S.touch) move(e); }); addEventListener('mouseup',up);

/* ---------- warmth: real charger where the browser allows it, otherwise the sun button ---------- */
feedBtn.addEventListener('click', e => { e.stopPropagation(); S.warm=!S.warm; feedBtn.classList.toggle('on',S.warm); askMotion(); });
if(navigator.getBattery){ navigator.getBattery().then(b=>{ const f=()=>{ S.warm=b.charging; feedBtn.classList.toggle('on',S.warm); }; f(); b.addEventListener('chargingchange',f); }).catch(()=>{}); }

/* it wakes when you come back */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ S.wake=0; } });

function heartbeat(t){ // lub-dub, about 60 a minute
  if(t >= S.nextBeat){ S.nextBeat = t + 1000; S.pulse = 1;
    if(navigator.vibrate) navigator.vibrate([28,110,38]);
    setTimeout(()=>{ S.pulse = Math.max(S.pulse, 0.7); }, 140); } }

/* ---------- main loop ---------- */
let last = performance.now();
function frame(t){
  const dt = Math.max(0, Math.min(0.05, (t-last)/1000)); last = Math.max(last, t);
  const secs = (t-T0)/1000, night = nightAmount();
  S.wake = Math.min(1, S.wake + dt/warmupSecs);
  S.warmAmt += ((S.warm?1:0) - S.warmAmt) * dt*0.6;
  S.startle *= Math.pow(0.2, dt);

  // breathing: ~6 a minute by day, slower at night
  const period = lerp(10, 15, night);
  const breath = 0.5 - 0.5*Math.cos(secs*2*Math.PI/period);

  // drifting home: smoke-like wander around the lower middle of the screen
  const hx = W/2 + noise(secs*0.05, 3.1)*W*0.22, hy = H*0.56 + noise(7.7, secs*0.045)*H*0.12;
  let tx = hx, ty = hy;
  if(S.touch){ const dx=S.touch.x-S.x, dy=S.touch.y-S.y, d=Math.hypot(dx,dy);
    const pull = d < 70 ? -0.15 : 0.55 + 0.35*bond; // leans in, but backs off if you poke right at it
    tx = S.x + dx*pull; ty = S.y + dy*pull;
    if(performance.now()-S.holdStart > 650 && d < 220){ S.beating = true; }
  }
  const k = S.touch ? 2.2 : 0.9, damp = S.touch ? 2.6 : 1.8;
  S.vx += ((tx-S.x)*k - S.vx*damp)*dt; S.vy += ((ty-S.y)*k - S.vy*damp)*dt;
  S.x += S.vx*dt*1.0; S.y += S.vy*dt*1.0;
  // slosh: tilt pushes it like liquid, then it settles
  const tiltX = S.gx*38, tiltY = (S.gy-1)*28;
  S.svx += ((tiltX - S.sx)*14 - S.svx*3.2)*dt; S.svy += ((tiltY - S.sy)*14 - S.svy*3.2)*dt;
  S.sx += S.svx*dt; S.sy += S.svy*dt;

  if(S.beating) heartbeat(t);
  S.pulse *= Math.pow(0.02, dt);

  // overall light level
  const level = S.wake * lerp(1, 0.55, night) * (1 - lonely*0.35) * (0.72 + bond*0.28) * (0.85 + breath*0.25 + S.pulse*0.25);

  // fade previous frame (leaves smoky trails)
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(0,0,0,${0.22 + night*0.06})`; ctx.fillRect(0,0,W,H);

  // ambient halo
  const cx = S.x+S.sx, cy = S.y+S.sy;
  const haloR = (110 + breath*40 + S.warmAmt*30) * (0.8+bond*0.3);
  const hr = ctx.createRadialGradient(cx,cy,0,cx,cy,haloR*2.2);
  const wr = Math.round(lerp(255,255,S.warmAmt)), wg = Math.round(lerp(lerp(140,110,night),95,S.warmAmt)), wb = Math.round(lerp(lerp(60,70,night),35,S.warmAmt));
  hr.addColorStop(0,`rgba(${wr},${wg},${wb},${0.16*level})`); hr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = hr; ctx.fillRect(0,0,W,H);

  // particles rise against gravity, curl through noise like smoke
  ctx.globalCompositeOperation = 'lighter';
  const upx = -S.gx, upy = -S.gy;
  const rise = (34 + breath*18 + S.warmAmt*16) * lerp(1,0.6,night);
  for(const p of parts){
    p.life += dt * lerp(1,0.7,night);
    if(p.life >= p.max){ spawn(p); continue; }
    const f = p.life/p.max;
    const n1 = noise(p.x*0.012 + p.seed, secs*0.35), n2 = noise(p.y*0.012 - p.seed, secs*0.35 + 9);
    p.vx += (upx*rise + n1*34 - (p.x-cx)*0.22*Math.abs(upy) - (p.y-cy)*0.35*Math.abs(upx)) * dt*2; p.vy += (upy*rise + n2*30) * dt*2;
    if(S.startle>0.05){ p.vx += (Math.random()-.5)*S.startle*60*dt*10; p.vy += (Math.random()-.5)*S.startle*60*dt*10; }
    p.vx *= 0.94; p.vy *= 0.94; p.x += p.vx*dt*3; p.y += p.vy*dt*3;
    const env = Math.sin(Math.PI*f);                     // fade in and out
    const heat = 1 - f;                                  // white-gold at birth, red at the tips
    const r = 255, g = Math.round(lerp(45, 200, heat*heat) - S.warmAmt*15), b = Math.round(lerp(8, 95, heat**3) * (1-night*0.4));
    const sz = p.size * (1-f*0.55) * (0.85+breath*0.3) * (0.9+bond*0.2);
    ctx.globalAlpha = Math.min(1, env * 0.38 * level);
    ctx.drawImage(tint(r,Math.min(255,g),b), p.x-sz, p.y-sz, sz*2, sz*2);
  }

  // bright core
  const coreR = (20 + breath*6 + S.pulse*10) * (0.85+bond*0.25);
  ctx.globalAlpha = Math.min(1, 0.75*level);
  ctx.drawImage(tint(255, Math.round(205-S.warmAmt*20), Math.round(lerp(120,70,S.warmAmt))), cx-coreR*1.6, cy-coreR*1.6, coreR*3.2, coreR*3.2);

  // heartbeat ring
  if(S.pulse > 0.02){ ctx.globalAlpha = S.pulse*0.5*level; ctx.strokeStyle='rgba(255,200,120,1)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(cx,cy, coreR*1.4 + (1-S.pulse)*60, 0, Math.PI*2); ctx.stroke(); }

  // eyes: two faint points that blink and glance toward your finger
  if(t > S.nextBlink){ S.blink = 1; S.nextBlink = t + 2500 + Math.random()*5500 + night*4000; }
  S.blink = Math.max(0, S.blink - dt*7);
  const open = night > 0.85 && !S.touch ? 0.12 : 1 - Math.sin(Math.min(1,S.blink)*Math.PI); // mostly closed when asleep
  let lx = 0, ly = 0; if(S.touch){ const dx=S.touch.x-cx, dy=S.touch.y-cy, d=Math.hypot(dx,dy)||1; lx=dx/d*3; ly=dy/d*2.4; }
  else { lx = noise(secs*0.2, 40)*2.5; ly = noise(50, secs*0.2)*1.5; }
  S.look.x += (lx-S.look.x)*dt*5; S.look.y += (ly-S.look.y)*dt*5;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.7*level;
  ctx.fillStyle = 'rgba(60,18,2,1)';
  for(const side of [-1,1]){ const ex = cx + side*coreR*0.38 + S.look.x, ey = cy - coreR*0.1 + S.look.y;
    ctx.beginPath(); ctx.ellipse(ex, ey, 2.6, Math.max(0.3, 3.3*open), 0, 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
if(location.search.includes('preview')){ // test hook: fast-forward ~6s so a still capture shows the settled creature
  S.wake=1; const raf=window.requestAnimationFrame; window.requestAnimationFrame=()=>0;
  let ft=performance.now(); for(let i=0;i<360;i++){ ft+=16.7; frame(ft); } window.requestAnimationFrame=raf; }
requestAnimationFrame(frame);

if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
