<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#07050f"/>
<title>Soft7</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;background:#07050f;color:#F6DFA0;font-family:system-ui,sans-serif}
.bg,.poster{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.poster{background:#07050f url("/assets/soft7-bg-poster.jpg") 50% 40%/cover no-repeat}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(7,5,15,.78),rgba(7,5,15,.42) 40%,rgba(7,5,15,.82))}
#trail,#dot{position:fixed;left:0;top:0;z-index:4;pointer-events:none}
#dot{width:14px;height:14px;border-radius:50%;opacity:0;background:radial-gradient(circle,#fff 0%,#E6B85C 35%,rgba(255,122,42,0) 72%);box-shadow:0 0 12px rgba(255,122,42,.85)}
main{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4.5rem 1.25rem 3rem}
h1{margin:0;font-weight:500;font-size:clamp(2rem,7vw,3.6rem);letter-spacing:-.03em;text-shadow:0 2px 18px rgba(7,5,15,.9)}
.line{margin:.8rem 0 0;font-size:clamp(1.15rem,3.5vw,1.7rem);color:#d9c8ff;text-shadow:0 2px 14px rgba(7,5,15,.95)}
.cap{margin:1.1rem 0 .2rem;font:.8rem ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#F6DFA0;text-shadow:0 1px 8px rgba(7,5,15,.9)}
.globe{width:min(52vw,200px);aspect-ratio:1;margin:.4rem auto 0;border-radius:50%;display:grid;place-items:center;position:relative;text-decoration:none;color:#F6DFA0;background:radial-gradient(circle at 32% 28%,rgba(246,223,160,.7),transparent 26%),radial-gradient(circle at 50% 55%,#24143f 0%,#07050f 72%);box-shadow:0 0 36px rgba(155,109,255,.4),inset 0 0 24px rgba(255,122,42,.28);overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.globe i{position:absolute;inset:7%;border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(230,184,92,.45) 14px 15px),repeating-linear-gradient(0deg,transparent 0 14px,rgba(204,255,0,.22) 14px 15px);-webkit-mask:radial-gradient(circle,#000 62%,transparent 72%);mask:radial-gradient(circle,#000 62%,transparent 72%)}
.globe b{position:relative;z-index:1;font:.78rem ui-monospace,Menlo,monospace;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.globe:hover,.globe:focus-visible,.globe:active{box-shadow:0 0 28px rgba(255,122,42,.75),0 0 64px rgba(155,109,255,.55);outline:none}
.globe.zoom{transform:scale(1.18);transition:transform .45s ease}
.hots{display:flex;justify-content:center;gap:.7rem;margin:1.15rem 0 0;padding:0;flex-wrap:wrap}
.hots a{min-width:2.75rem;min-height:2.75rem;padding:.7rem .85rem;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#140c08;background:radial-gradient(circle at 35% 30%,#fff,#E6B85C 42%,#ff7a2a);box-shadow:0 0 16px rgba(255,122,42,.85);font:.68rem ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.04em;touch-action:manipulation}
.hots a:hover,.hots a:focus-visible,.hots a:active{box-shadow:0 0 22px rgba(204,255,0,.7),0 0 28px rgba(255,122,42,.9);outline:none}
.lights{margin:1.4rem 0 0;max-width:22rem;font-size:.95rem;color:#d9c8ff;text-shadow:0 1px 8px rgba(7,5,15,.9)}
.tune{position:fixed;top:1rem;right:1rem;z-index:6;border:1px solid rgba(230,184,92,.5);background:rgba(7,5,15,.72);color:#F6DFA0;border-radius:999px;padding:.55rem .8rem;font:.72rem ui-monospace,Menlo,monospace;letter-spacing:.06em;cursor:pointer;touch-action:manipulation}
.tune:hover,.tune:focus-visible,.tune:active{box-shadow:0 0 16px rgba(204,255,0,.4);outline:none}
@media (prefers-reduced-motion:no-preference){.globe i{animation:spin 22s linear infinite}}
@media (prefers-reduced-motion:reduce){.bg,#trail,#dot{display:none}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="poster" aria-hidden="true"></div>
<video class="bg" id="bg" autoplay muted loop playsinline webkit-playsinline preload="metadata" poster="/assets/soft7-bg-poster.jpg" aria-hidden="true">
<source src="/assets/soft7-bg-loop-v4b.mp4" type="video/mp4"/>
</video>
<div class="veil" aria-hidden="true"></div>
<canvas id="trail" aria-hidden="true"></canvas>
<div id="dot" aria-hidden="true"></div>
<button class="tune" type="button">Tune in. Three. Six. Nine.</button>
<main>
<h1>Soft7 is the first door.</h1>
<p class="line">Seven cards. One phoenix rising.</p>
<p class="cap">Touch the signal. Enter.</p>
<a class="globe" id="globe" href="/phoenix"><i aria-hidden="true"></i><b>Enter</b></a>
<nav class="hots" aria-label="Signals">
<a href="/phoenix">Enter</a>
<a href="https://opensea.io/collection/reynard-soft7" target="_blank" rel="noopener noreferrer">OpenSea</a>
<a href="https://x.com/tigerwillca" target="_blank" rel="noopener noreferrer">X</a>
</nav>
<p class="lights">Seven lights. Seven nods. Find them in the signal.</p>
</main>
<script>
(function(){
  var v=document.getElementById('bg');
  if(v){ v.muted=true; v.defaultMuted=true; v.playsInline=true; v.setAttribute('muted',''); v.setAttribute('playsinline',''); }
  var globe=document.getElementById('globe');
  if(globe){
    globe.addEventListener('click',function(ev){
      if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      ev.preventDefault();
      globe.classList.add('zoom');
      setTimeout(function(){ location.href='/phoenix'; }, 480);
    });
  }
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var c=document.getElementById('trail'), dot=document.getElementById('dot');
  if(!c||!c.getContext) return;
  var x=c.getContext('2d'), dpr=Math.min(devicePixelRatio||1,2), parts=[], cap=120, idle=true;
  function size(){ c.width=innerWidth*dpr; c.height=innerHeight*dpr; c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px'; x.setTransform(dpr,0,0,dpr,0,0); }
  function emit(cx,cy,n){
    for(var i=0;i<n;i++){
      if(parts.length>=cap) parts.shift();
      var a=Math.random()*6.283, sp=.3+Math.random()*1.4;
      parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.2,life:1,r:1+Math.random()*1.6,hue:Math.random()<.5?'#ff7a2a':'#E6B85C'});
    }
    if(idle){ idle=false; requestAnimationFrame(frame); }
  }
  function place(cx,cy){
    dot.style.opacity='1';
    dot.style.transform='translate3d('+(cx-7)+'px,'+(cy-7)+'px,0)';
    emit(cx,cy,2);
  }
  function frame(){
    x.clearRect(0,0,innerWidth,innerHeight);
    x.globalCompositeOperation='lighter';
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.life-=.02;
      if(p.life<=0){ parts.splice(i,1); continue; }
      x.globalAlpha=Math.max(0,p.life); x.fillStyle=p.hue;
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283); x.fill();
    }
    x.globalAlpha=1; x.globalCompositeOperation='source-over';
    if(parts.length) requestAnimationFrame(frame); else idle=true;
  }
  addEventListener('pointermove',function(e){ if(e.pointerType==='touch') return; place(e.clientX,e.clientY); },{passive:true});
  addEventListener('touchstart',function(e){ var t=e.changedTouches&&e.changedTouches[0]; if(t) place(t.clientX,t.clientY); },{passive:true});
  addEventListener('touchmove',function(e){ var t=e.touches&&e.touches[0]; if(t) place(t.clientX,t.clientY); },{passive:true});
  addEventListener('resize',size); size();
})();
</script>
</body>
</html>
