<style>

    min-height: 100vh;

  .veil {

  main {
    position: relative;

    width: min(100% - 2rem, 40rem);

    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: calc(1.25rem + env(safe-area-inset-top)) 0 calc(1.6rem + env(safe-area-inset-bottom));
    gap: .35rem;
  }
  .mark {
    margin: 0;
    color: var(--lime);
    font: 600 .68rem ui-monospace, Menlo, monospace;
    letter-spacing: .22em;
    text-transform: uppercase;
    text-shadow: 0 1px 3px rgba(6,4,12,.9);
  }
  .seal {
    width: min(68vw, 250px);
    margin: .35rem auto .15rem;

  .seal svg { display: block; width: 100%; height: auto; overflow: visible; }
  .orbit { stroke-dasharray: 3 8; }
  @media (prefers-reduced-motion: no-preference) {
    .orbit { animation: crawl 36s linear infinite; }
    .breathe { animation: breathe 9s ease-in-out infinite; transform-origin: 140px 140px; }
  }
  @keyframes crawl { to { stroke-dashoffset: -220; } }
  @keyframes breathe { 50% { opacity: .62; } }
  h1 {
    margin: .2rem 0 .15rem;
    font-weight: 500;
    font-size: clamp(1.55rem, 5.4vw, 2.15rem);
    letter-spacing: -.03em;
    color: var(--gold-hi);
    text-shadow: 0 0 24px var(--gold-glow), 0 1px 3px rgba(6,4,12,.95);
  }
  .quiet {
    margin: 0;
    color: var(--muted);
    font-size: .82rem;
    letter-spacing: .04em;
  }
  .log { width: 100%; margin-top: .85rem; text-align: left; }
  .log h2 {
    margin: 0 0 .65rem;
    text-align: center;
    font-weight: 500;
    font-size: .72rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 0 1px 3px rgba(6,4,12,.9);
  }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
  li {
    border-radius: 12px;
    padding: .85rem 1rem;
    min-height: 3rem;
  }
  li.open {
    display: flex;
    align-items: center;
    gap: .7rem;
    color: var(--gold-hi);
    background: rgba(230,184,92,.06);
    border: 1px solid rgba(230,184,92,.38);
    box-shadow: 0 0 18px rgba(230,184,92,.06);
    font: 500 .95rem/1.45 ui-monospace, Menlo, monospace;
    letter-spacing: .01em;
  }
  li.open::before {
    content: "";
    width: .48rem;
    height: .48rem;
    flex: none;
    border-radius: 50%;
    background: var(--lime);
    box-shadow: 0 0 8px rgba(204,255,0,.75);
  }
  li.sealed {
    display: flex;
    align-items: center;
    gap: .75rem;
    min-width: 0;
    overflow: hidden;
    background: rgba(8,6,16,.62);
    border: 1px dashed rgba(155,109,255,.42);
    user-select: none;
  }
  .gem {
    width: .5rem;
    height: .5rem;
    flex: none;
    border: 1px solid rgba(230,184,92,.7);
    transform: rotate(45deg);
  }
  .glyphs {
    min-width: 0;
    flex: 1;
    filter: blur(4px);
    opacity: .72;
    color: var(--violet);
    letter-spacing: .32em;
    font: 500 .95rem/1 ui-monospace, Menlo, monospace;
    white-space: nowrap;
    overflow: hidden;
  }
  .fp {
    min-width: 0;
    flex: 1;
    color: var(--muted);
    letter-spacing: .06em;
    font: 500 .85rem/1 ui-monospace, Menlo, monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    user-select: text;
  }
  nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .35rem 1.15rem;
    margin-top: 1.15rem;
  }
  nav a {
    color: var(--gold-hi);
    text-decoration: none;
    border-bottom: 1px solid rgba(230,184,92,.4);
    padding: .2rem 0 .15rem;
    font-size: .95rem;
    text-shadow: 0 1px 3px rgba(6,4,12,.9);
  }
  nav a.door { color: var(--lime); border-bottom-color: rgba(204,255,0,.45); }
  nav a:hover { color: var(--gold-hi); border-bottom-color: var(--ember); }
  a:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .orbit, .breathe { animation: none; }
  }
</style>

        <path d="M138.4 128.6c-6.2-.8-12.3-6.1-15.4-9.2 4.6.8 9.2 3.1 12.3 6.2-4.6-1.5-10.8-1.5-15.4 1.5 6.2 0 10.8 2.3 13.8 4.6-3.1.8-7.7 3.1-10.8 6.2 4.6-1.5 9.2-2.3 12.3-1.5-1.5 3.1-1.5 6.9 0 10 0.8-3.8 2.3-6.9 4.6-9.2 2.3 2.3 3.8 5.4 4.6 9.2 1.5-3.1 1.5-6.9 0-10 3.1-.8 7.7 0 12.3 1.5-3.1-3.1-7.7-5.4-10.8-6.2 3.1-2.3 7.7-4.6 13.8-4.6-4.6-3.1-10.8-3.1-15.4-1.5 3.1-3.1 7.7-5.4 12.3-6.2-3.1 3.1-9.2 8.4-15.4 9.2-.8 1.5-1.1 3.1-1.2 4.6h-.9c-.2-1.5-.5-3.1-1.3-4.6z" fill="#E6B85C"/>

<script>
(function () {
  // Entries with text are open; entries without text stay sealed.
  // A sealed entry may carry a fingerprint: only its short form is shown.
  var TRANSMISSIONS = [
    { text: 'Soft7 is the first door.' },
    { text: 'Pulse is listening.' },
    { text: '' },
    { text: '', fingerprint: '851427ec6a231e996d0e473d18b7c86ee2147c2747f3198e8b1ecf90c2785782' }
  ];
  var GLYPH = ['\u25C7', '\u25C6', '\u2234', '\u2237', '\u25CB', '\u00B7', '\u2726', '\u25CC'];
  var log = document.getElementById('log');

  function glyphRow(i) {
    var s = '', n = 11 + i * 7, k;
    for (k = 0; k < 14; k++) s += GLYPH[(n + k * 3) % GLYPH.length] + '\u2002';
    return s.trim();
  }
  function isOpen(entry) {
    return !!(entry && entry.text && String(entry.text).trim());
  }
  TRANSMISSIONS.forEach(function (entry, i) {
    var li = document.createElement('li');
    if (isOpen(entry)) {
      li.className = 'open';
      li.textContent = String(entry.text).trim();
    } else {
      li.className = 'sealed';
      var gem = document.createElement('span');
      gem.className = 'gem';
      gem.setAttribute('aria-hidden', 'true');
      li.appendChild(gem);
      if (entry.fingerprint) {
        var fp = String(entry.fingerprint);
        li.setAttribute('data-sha256', fp);
        li.setAttribute('aria-label', 'Sealed transmission, fingerprint ' + fp.slice(0, 12));
        var mark = document.createElement('span');
        mark.className = 'fp';
        mark.textContent = 'sealed · ' + fp.slice(0, 12) + '…';
        li.appendChild(mark);
      } else {
        li.setAttribute('aria-label', 'Sealed transmission');
        var glyphs = document.createElement('span');
        glyphs.className = 'glyphs';
        glyphs.setAttribute('aria-hidden', 'true');
        glyphs.textContent = glyphRow(i);
        li.appendChild(glyphs);
      }
    }
    log.appendChild(li);
  });

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var c = document.getElementById('sky');
  if (!c || !c.getContext) return;
  var x = c.getContext('2d');
  function paint() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    c.width = Math.floor(w * dpr);
    c.height = Math.floor(h * dpr);
    c.style.width = w + 'px';
    c.style.height = h + 'px';
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, w, h);
    var seed = 369369;
    function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    var n = Math.min(150, Math.round(w * h / 17000)), i;
    for (i = 0; i < n; i++) {
      var gold = rnd() < 0.16;
      x.fillStyle = gold ? 'rgba(230,184,92,' + (0.3 + rnd() * 0.65) + ')' : 'rgba(236,230,246,' + (0.18 + rnd() * 0.5) + ')';
      x.fillRect(rnd() * w, rnd() * h, rnd() < 0.07 ? 1.6 : 0.85, rnd() < 0.07 ? 1.6 : 0.85);
    }
  }
  window.addEventListener('resize', paint);
  paint();
  if (reduce) return;
})();
</script>
