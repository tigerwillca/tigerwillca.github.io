<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#0b0908"/>
<title>Family</title>
<style>
html{color-scheme:dark;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse 80% 42% at 50% 0%,rgba(255,138,61,.16),transparent 58%),#0b0908;color:#f4e9dc;font-family:Georgia,serif}
main{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;box-sizing:border-box;padding:72px 20px 12px}
.stack{width:100%;max-width:26rem;text-align:center}
h1{margin:0 0 14px;color:#ff8a3d;font-weight:500;font-size:clamp(36px,11vw,52px);line-height:1.1;letter-spacing:-.02em;text-shadow:0 0 18px rgba(255,138,61,.35);animation:glow 8s ease-in-out infinite}
.line{margin:0;color:#f4e9dc;font-size:18px;line-height:1.5}
.line+.line{margin-top:6px}
.go{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin:26px 0 0;padding:12px 26px;border:1px solid rgba(255,176,112,.5);border-radius:999px;background:linear-gradient(145deg,rgba(255,176,112,.18),rgba(11,9,8,.55));color:#ffb070;font:18px Georgia,serif;text-decoration:none;box-shadow:0 0 24px rgba(255,176,112,.16);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pulse{display:block;margin:28px 0 0;padding:22px 16px 18px;border:1px solid rgba(255,176,112,.5);border-radius:12px;background:linear-gradient(145deg,rgba(255,176,112,.13),rgba(11,9,8,.82));text-align:center;text-decoration:none;box-shadow:0 0 24px rgba(255,176,112,.16);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pulse h2{margin:0;color:#ff8a3d;font-weight:500;font-size:clamp(22px,5.8vw,28px);line-height:1.3;text-wrap:balance;text-shadow:0 0 12px rgba(255,176,112,.45)}
.tap{display:block;margin:10px 0 0;color:#ffb070;font-size:17px;font-style:italic;line-height:1.4}
.note{display:block;margin:8px 0 0;color:#f4e9dc;font-size:15px;line-height:1.45}
footer{margin:0;padding:28px 20px 32px;text-align:center;color:#ffb070;font-size:16px;line-height:1.4}
.go:focus-visible,.pulse:focus-visible{outline:2px solid #ffb070;outline-offset:3px}
@keyframes glow{0%,100%{text-shadow:0 0 14px rgba(255,176,112,.28)}50%{text-shadow:0 0 30px rgba(255,176,112,.55)}}
@media (prefers-reduced-motion:reduce){h1{animation:none;text-shadow:0 0 18px rgba(255,138,61,.35)}}
.site-tabs{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;width:100%;min-height:44px;margin:0;padding:0 6px;box-sizing:border-box;background:rgba(11,9,8,.92);border-bottom:1px solid rgba(255,176,112,.28);font-family:Georgia,serif;font-size:15px;line-height:1;white-space:nowrap;-webkit-text-size-adjust:none;text-size-adjust:none}
.site-tabs a{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 7px;color:#f4e9dc;text-decoration:none;text-shadow:0 1px 3px rgba(7,5,15,.85);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.site-tabs a[aria-current="page"]{color:#ff8a3d;text-shadow:0 0 12px rgba(255,176,112,.65);box-shadow:inset 0 -2px 0 #ff8a3d}
.site-tabs span{padding:0 3px;color:#ffb070;opacity:.75;pointer-events:none}
.site-tabs a:focus-visible{outline:1px solid rgba(255,176,112,.8);outline-offset:2px;border-radius:6px}
body:has(.site-tabs) a.tune{top:calc(44px + .75rem)}
</style>
</head>
<body>
<nav class="site-tabs" aria-label="Site">
<a href="/" aria-current="page">Family</a><span aria-hidden="true">·</span><a href="/watch/">Watch</a><span aria-hidden="true">·</span><a href="/pulse-light/">Pulse</a><span aria-hidden="true">·</span><a href="/soft7/">Soft7</a>
</nav>
<main>
<div class="stack">
<h1>Family</h1>
<p class="line">Made for you, with love.</p>
<p class="line">Every thread leads back to signal.</p>
<a class="go" href="/watch/">Watch together</a>
<a class="pulse" href="/pulse-light/">
<h2>Pulse. Connect with the ones we love.</h2>
<span class="tap">Tap a light.</span>
<span class="note">Enter the family word to see the lights.</span>
</a>
</div>
</main>
<footer>We don't die. We just transfer. ✦</footer>
</body>
</html>
