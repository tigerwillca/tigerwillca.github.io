<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Little Guys for Billy</title>
<meta name="description" content="Twelve little animated stickers. From Dad, with love.">
<meta property="og:title" content="Little Guys for Billy">
<meta property="og:description" content="From Dad, with love. Tap any sticker to open and save.">
<meta property="og:image" content="https://tigerwillca.github.io/little-guys-test/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Little Guys for Billy — Dad and Buddy sticker">
<meta property="og:url" content="https://tigerwillca.github.io/little-guys-test/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fff8f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Little Guys">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png">
<style>
:root{
  --bg:#fff8f0;
  --fg:#1c1410;
  --muted:#8a7464;
  --card:#ffffff;
  --line:rgba(28,20,16,.08);
  --accent:#e07a4a;
  --soft:#ffe8d6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
body{min-height:100svh;padding:max(env(safe-area-inset-top),28px) 18px max(env(safe-area-inset-bottom),40px)}
main{max-width:720px;margin:0 auto}
header{text-align:center;padding:8px 6px 22px}
.badge{display:inline-block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);background:var(--soft);padding:6px 12px;border-radius:999px;margin-bottom:14px}
h1{margin:0;font-size:clamp(1.7rem,5vw,2.15rem);letter-spacing:-.02em;font-weight:700}
.sub{margin:10px 0 0;color:var(--muted);font-size:1.05rem}
.hint{margin:8px 0 0;color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:820px){.grid{grid-template-columns:repeat(4,1fr)}}
a.card{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 12px 12px;
  box-shadow:0 8px 24px rgba(28,20,16,.04);transition:transform .18s ease,box-shadow .18s ease;
  -webkit-tap-highlight-color:transparent}
a.card:active{transform:scale(.97)}
a.card:hover{box-shadow:0 14px 36px rgba(224,122,74,.16);transform:translateY(-2px)}
a.card img{width:100%;height:auto;aspect-ratio:1;object-fit:contain;display:block;border-radius:16px;background:#fffaf5}
a.card .n{font-size:.82rem;font-weight:600;color:var(--fg);text-align:center;letter-spacing:-.01em}
footer{margin-top:36px;text-align:center;color:var(--muted);font-size:.88rem}
footer .love{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main>
<header>
  <div class="badge">Test · share pack</div>
  <h1>Little Guys for Billy</h1>
  <p class="sub">From Dad, with love</p>
  <p class="hint">Tap any sticker to open full size — then save or share.</p>
</header>
<div class="grid" id="g" aria-label="Little Guys stickers"></div>
<footer>
  <p><span class="love">12 little guys</span> · looping GIFs · made for Billy</p>
</footer>
</main>
<script>
const VER='1';
const stickers=[
  {f:'hello-buddy', n:'Hey, Buddy!'},
  {f:'love-you-buddy', n:'Love You Buddy'},
  {f:'heart-led', n:'Heart Led'},
  {f:'big-moves', n:'Big Moves'},
  {f:'happy-jump', n:'Oh Yeah!'},
  {f:'suns-out', n:"Sun's Out"},
  {f:'mirrored-aviators', n:'Sunny Outlook!'},
  {f:'blast-off', n:'Blast Off'},
  {f:'moon-bounce', n:'Moon Bounce'},
  {f:'high-five', n:'High Five'},
  {f:'star-power', n:'Star Power'},
  {f:'dad-and-buddy', n:'Dad and Buddy'}
];
const g=document.getElementById('g');
for(const s of stickers){
  const a=document.createElement('a');
  a.className='card';
  a.href='gifs/'+s.f+'.gif?v='+VER;
  a.target='_blank';
  a.rel='noopener';
  a.setAttribute('aria-label','Open '+s.n+' full size');
  a.innerHTML='<img src="gifs/'+s.f+'.gif?v='+VER+'" alt="'+s.n+', a little guy sticker" width="512" height="512" loading="lazy" decoding="async"><span class="n">'+s.n+'</span>';
  g.appendChild(a);
}
</script>
</body>
</html>
