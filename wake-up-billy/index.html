<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wake up, Billy</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}canvas{position:fixed;inset:0}
#t{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:700 6vw Consolas,monospace;color:#dfffe6;letter-spacing:.3em;text-shadow:0 0 14px #00ff66,0 0 50px #00ff66;opacity:0;pointer-events:none;transition:opacity 2s}
#v{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.9));pointer-events:none}
#go{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#00ff66;font:700 4vw Consolas,monospace;letter-spacing:.4em;text-shadow:0 0 20px #00ff66;cursor:pointer;z-index:9}
#go small{font-size:1.4vw;letter-spacing:.3em;opacity:.7;margin-top:2vw}#yt{position:fixed;width:1px;height:1px;left:-10px;top:-10px}</style></head>
<body><canvas id="c"></canvas><div id="v"></div><div id="t">WAKE UP, BILLY</div><div id="go">FOLLOW THE WHITE RABBIT<small>tap anywhere</small></div><div id="yt"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player,started=false,beat=0;
function onYouTubeIframeAPIReady(){player=new YT.Player('yt',{videoId:'WxY7O4eFHRk',playerVars:{autoplay:0,controls:0,loop:1,playlist:'WxY7O4eFHRk,8qWePX39R40,VBCDiYFMD8s,alcE94QJW90'}})}
document.getElementById('go').onclick=()=>{if(started)return;started=true;document.getElementById('go').remove();
 try{document.documentElement.requestFullscreen()}catch(e){} if(player&&player.playVideo){player.setVolume(100);player.playVideo()}
 setInterval(()=>{const t=document.getElementById('t');t.style.opacity=t.style.opacity=='0.9'?'0':'0.9'},6000)};
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,cols,drops,sp;const fs=18;
const ch='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789Z:・."=*+-<>¦';
function r(){W=c.width=innerWidth;H=c.height=innerHeight;cols=Math.floor(W/fs);drops=Array(cols).fill(0).map(()=>Math.random()*-H/fs);sp=Array(cols).fill(0).map(()=>0.6+Math.random()*1.4)}
r();addEventListener('resize',r);const bpm=100,t0=performance.now();
function f(now){const ph=((now-t0)/60000*bpm)%1, kick=started?Math.pow(1-ph,4):0.2;
x.fillStyle='rgba(0,0,0,'+(0.09-0.04*kick)+')';x.fillRect(0,0,W,H);x.font=fs+'px Consolas,monospace';
for(let i=0;i<cols;i++){const y=drops[i]*fs;x.shadowBlur=10+30*kick;x.shadowColor='#00ff66';x.fillStyle='#effff3';
x.fillText(ch[Math.random()*ch.length|0],i*fs,y);x.shadowBlur=0;x.fillStyle='rgba(0,255,102,'+(0.45+0.5*kick)+')';x.fillText(ch[Math.random()*ch.length|0],i*fs,y-fs);
if(y>H&&Math.random()>0.975){drops[i]=0;sp[i]=0.6+Math.random()*1.6}drops[i]+=sp[i]*(1+1.5*kick)}
requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
