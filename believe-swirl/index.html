<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Believe Swirl</title>
<meta name="description" content="A minute of warm light, and one kind line for today.">
<meta name="theme-color" content="#0b0916">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Believe Swirl">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#0b0916;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:#f6e7cf;cursor:pointer}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #cue{position:fixed;left:0;right:0;bottom:calc(16vh + env(safe-area-inset-bottom));text-align:center;
    font-size:1.05rem;letter-spacing:.18em;text-transform:lowercase;color:#f3d9b0;opacity:0;
    transition:opacity 1.6s ease;pointer-events:none}
  #line{position:fixed;left:8vw;right:8vw;top:50%;transform:translateY(-50%);text-align:center;
    font-size:clamp(1.5rem,6.2vw,2.4rem);line-height:1.4;color:#fff3df;opacity:0;
    text-shadow:0 0 24px rgba(255,190,120,.45),0 0 2px rgba(0,0,0,.6);
    transition:opacity 4s ease;pointer-events:none}
  #line.show{opacity:1}
  #hint{position:fixed;left:0;right:0;bottom:calc(5vh + env(safe-area-inset-bottom));text-align:center;
    font-size:.8rem;letter-spacing:.12em;color:#c9ad8a;opacity:0;transition:opacity 3s ease 3s;pointer-events:none}
  #hint.show{opacity:.45}
  #tone{position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));
    width:44px;height:44px;border-radius:22px;border:1px solid rgba(243,217,176,.18);background:rgba(255,255,255,.03);
    color:#d9bf98;font-size:18px;opacity:.45;cursor:pointer;padding:0}
  #tone[aria-pressed="true"]{opacity:.85;border-color:rgba(255,200,130,.5);box-shadow:0 0 14px rgba(255,180,110,.25)}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="cue" aria-live="polite"></div>
<div id="line" role="status"></div>
<div id="hint">tap to breathe again</div>
<button id="tone" type="button" aria-pressed="false" aria-label="Soft tone (off)" title="Soft tone">&#9835;</button>
<script src="app.js"></script>
</body>
</html>
