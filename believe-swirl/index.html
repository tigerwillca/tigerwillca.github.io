<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Believe Swirl</title>
<meta name="description" content="A minute of warm light, and one kind line for today.">
<meta name="theme-color" content="#0b0916">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Believe Swirl">
<link rel="canonical" href="https://tigerwillca.github.io/believe-swirl/">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0916;
    color: #f6e7cf;
    color-scheme: dark;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  body {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    cursor: pointer;
    overscroll-behavior: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  button, a { font-family: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, a:focus-visible {
    outline: 2px solid #f3e6d4;
    outline-offset: 3px;
  }
  #look, #tone {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    width: 44px;
    height: 44px;
    border-radius: 22px;
    border: 1px solid rgba(243, 217, 176, 0.32);
    background: rgba(11, 9, 22, 0.55);
    color: #f3e6d4;
    padding: 0;
    z-index: 3;
  }
  #look { left: calc(14px + env(safe-area-inset-left)); }
  #tone { right: calc(14px + env(safe-area-inset-right)); font-size: 18px; }
  #look:active, #tone:active, #share:active { transform: scale(0.97); }
  #swatch {
    display: block;
    width: 16px;
    height: 16px;
    margin: 0 auto;
    border-radius: 50%;
    background: #ffdc82;
    box-shadow: 0 0 8px rgba(255, 200, 140, 0.7);
  }
  #look-name {
    position: fixed;
    top: calc(24px + env(safe-area-inset-top));
    left: calc(66px + env(safe-area-inset-left));
    z-index: 3;
    margin: 0;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    color: #f6eadc;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
  }
  #look-name.show { opacity: 1; }
  #cue {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(16vh + env(safe-area-inset-bottom));
    z-index: 2;
    text-align: center;
    font-size: 1.05rem;
    letter-spacing: 0.18em;
    text-transform: lowercase;
    color: #f6e4cc;
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
  }
  #line {
    position: fixed;
    left: 8vw;
    right: 8vw;
    top: 44%;
    transform: translateY(-50%);
    z-index: 2;
    text-align: center;
    font-size: clamp(1.5rem, 6.2vw, 2.35rem);
    line-height: 1.35;
    color: #fff6e8;
    opacity: 0;
    text-wrap: balance;
    text-shadow:
      0 1px 2px rgba(0, 0, 0, 0.85),
      0 0 16px rgba(0, 0, 0, 0.65);
    transition: opacity 4s ease;
    pointer-events: none;
  }
  #line.show { opacity: 1; }
  #actions {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(12vh + env(safe-area-inset-bottom));
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2.2s ease;
  }
  #actions.show {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
  }
  #share {
    font-size: 1rem;
    color: #f6eadc;
    background: rgba(11, 9, 22, 0.45);
    border: 1px solid rgba(243, 217, 176, 0.4);
    border-radius: 999px;
    min-height: 44px;
    padding: 8px 22px;
    letter-spacing: 0.03em;
  }
  #support {
    color: #ead9c2;
    font-size: 0.95rem;
    line-height: 1.3;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-decoration-color: rgba(234, 217, 194, 0.55);
    text-underline-offset: 0.28em;
    min-height: 44px;
    padding: 10px 14px;
    display: inline-flex;
    align-items: center;
  }
  #note {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100%;
    margin: 0 0 6px;
    text-align: center;
    font-size: 0.95rem;
    color: #f6eadc;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
  }
  #note.show { opacity: 1; }
  #hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(4.5vh + env(safe-area-inset-bottom));
    z-index: 2;
    text-align: center;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    color: #e4d0b4;
    opacity: 0;
    transition: opacity 2.4s ease 1.2s;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
  }
  #hint.show { opacity: 1; }
  #noscript {
    position: fixed;
    left: 10vw;
    right: 10vw;
    top: 42%;
    text-align: center;
    font-size: 1.2rem;
    line-height: 1.45;
    color: #f6eadc;
  }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  @media (max-height: 680px) {
    #line { top: 40%; font-size: clamp(1.3rem, 5.6vw, 1.9rem); }
    #actions { bottom: calc(14vh + env(safe-area-inset-bottom)); }
  }
  @media (prefers-reduced-motion: reduce) {
    #cue, #line, #hint, #actions, #note, #look-name { transition: none; }
    #look:active, #tone:active, #share:active { transform: none; }
  }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<button id="look" type="button" aria-label="Swirl style: Amber. Tap to change.">
  <span id="swatch" aria-hidden="true"></span>
</button>
<p id="look-name" aria-hidden="true"></p>
<button id="tone" type="button" aria-pressed="false" aria-label="Soft tone (off)" title="Soft tone">&#9835;</button>
<div id="cue" aria-live="polite"></div>
<div id="line" role="status" aria-hidden="true"></div>
<div id="actions" aria-hidden="true">
  <p id="note" role="status"></p>
  <button id="share" type="button">Share</button>
</div>
<div id="hint">tap to breathe again</div>
<p id="look-live" class="sr" aria-live="polite"></p>
<noscript><p id="noscript">A minute of warm light needs JavaScript turned on. This page still doesn’t track you.</p></noscript>
<script src="app.js"></script>
</body>
</html>
