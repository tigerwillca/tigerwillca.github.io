<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cute pack</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0b0f;
      color: #f2f2f5;
      padding: 24px 16px 48px;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (min-width: 480px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }
    a.sticker {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: inherit;
      background: #16161d;
      border-radius: 20px;
      padding: 14px 10px 12px;
    }
    a.sticker img {
      width: 100%;
      max-width: 140px;
      height: auto;
      aspect-ratio: 1;
      object-fit: contain;
    }
    a.sticker span {
      font-size: 0.85rem;
      font-weight: 600;
      color: #d6d6de;
    }
    .download {
      display: block;
      width: 100%;
      margin: 28px 0 0;
      padding: 14px 18px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      color: #0b0b0f;
      background: #f2f2f5;
      border-radius: 14px;
    }
    footer {
      margin-top: 32px;
      text-align: center;
      color: #8a8a96;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Cute pack</h1>
    <div class="grid">
      <a class="sticker" href="10-tiger.gif"><img src="10-tiger.gif" alt="Tiger" width="140" height="140"><span>Tiger</span></a>
      <a class="sticker" href="11-reynard.gif"><img src="11-reynard.gif" alt="Fox" width="140" height="140"><span>Fox</span></a>
      <a class="sticker" href="12-raccoon.gif"><img src="12-raccoon.gif" alt="Raccoon" width="140" height="140"><span>Raccoon</span></a>
      <a class="sticker" href="13-owl.gif"><img src="13-owl.gif" alt="Owl" width="140" height="140"><span>Owl</span></a>
      <a class="sticker" href="09-pegasus.gif"><img src="09-pegasus.gif" alt="Pegasus" width="140" height="140"><span>Pegasus</span></a>
      <a class="sticker" href="03-wolf-eyes.gif"><img src="03-wolf-eyes.gif" alt="Wolf" width="140" height="140"><span>Wolf</span></a>
      <a class="sticker" href="04-the-pack.gif"><img src="04-the-pack.gif" alt="The Pack" width="140" height="140"><span>The Pack</span></a>
      <a class="sticker" href="05-third-eye.gif"><img src="05-third-eye.gif" alt="Third Eye Wolf" width="140" height="140"><span>Third Eye Wolf</span></a>
    </div>
    <a class="download" href="cute-pack.zip">Download all</a>
    <footer>made by Billy</footer>
  </main>
</body>
</html>
