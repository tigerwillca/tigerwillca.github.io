<style>
  :root{
    --ink:#07080d; --gold:#F5D78E; --gold2:#E8C468; --deep:#B88A3A;
    --lime:#CCFF00; --text:#ECE9F7;
    --swirl-ms:700ms; --graf-ms:700ms; --spot-ms:800ms; --owl-ms:800ms;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text);
    font:700 16px/1.15 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    min-height:100%;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    overflow-x:hidden}
  body{min-height:100dvh;min-height:-webkit-fill-available;
    background:
      radial-gradient(90vw 50vh at 50% -8%, rgba(245,215,142,.22), transparent 60%),
      radial-gradient(70vw 45vh at 100% 110%, rgba(204,255,0,.08), transparent 58%),
      radial-gradient(60vw 40vh at 0% 80%, rgba(120,70,210,.18), transparent 55%),
      linear-gradient(180deg,#151729 0%, var(--ink) 55%)}

  .stage{position:relative;min-height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:max(8px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));
    isolation:isolate;overflow-x:hidden;width:100%}

  .layer{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;overflow:hidden}
  .swirl-ring{position:absolute;left:50%;top:42%;border-radius:50%;
    border:2px solid rgba(245,215,142,.55);transform:translate(-50%,-50%) scale(1.4);
    opacity:0;aspect-ratio:1;width:min(80vmin,520px)}
  .swirl-ring.r2{width:min(56vmin,360px);border-color:rgba(204,255,0,.45)}
  .swirl-ring.r3{width:min(34vmin,220px);border-color:rgba(160,90,255,.4)}
  .swirl-layer.play{opacity:1}
  .swirl-layer.play .swirl-ring{
    animation:swirlSpin var(--swirl-ms) cubic-bezier(.2,.7,.2,1) forwards}
  .swirl-layer.play .r2{animation-delay:40ms}
  .swirl-layer.play .r3{animation-delay:80ms}
  @keyframes swirlSpin{
    0%{opacity:0;transform:translate(-50%,-50%) scale(1.45) rotate(0deg)}
    18%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(540deg)}
  }

  .graf-stroke{position:absolute;height:8px;border-radius:8px;opacity:0;
    transform:translateX(-120%) rotate(var(--rot, -8deg));
    left:-10%;width:120%}
  .graf-stroke.g1{top:28%;background:rgba(204,255,0,.85);--rot:-12deg;height:10px}
  .graf-stroke.g2{top:46%;background:rgba(170,110,255,.75);--rot:8deg;height:8px}
  .graf-stroke.g3{top:62%;background:rgba(0,220,255,.7);--rot:-6deg;height:9px}
  .graf-stroke.g4{top:18%;background:rgba(245,215,142,.7);--rot:10deg;height:6px;width:90%;left:5%}
  .graffiti-layer.play{opacity:1}
  .graffiti-layer.play .graf-stroke{
    animation:grafWipe var(--graf-ms) cubic-bezier(.2,.85,.2,1) forwards}
  .graffiti-layer.play .g2{animation-delay:60ms}
  .graffiti-layer.play .g3{animation-delay:120ms}
  .graffiti-layer.play .g4{animation-delay:40ms}
  @keyframes grafWipe{
    0%{opacity:0;transform:translateX(-120%) rotate(var(--rot, -8deg))}
    28%{opacity:1}
    70%{opacity:.9;transform:translateX(8%) rotate(var(--rot, -8deg))}
    100%{opacity:0;transform:translateX(28%) rotate(var(--rot, -8deg))}
  }

  .spot-beam{position:absolute;top:-10%;width:min(70vw,520px);height:120%;
    left:-40%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,252,235,.85) 0,rgba(255,236,180,.4) 22%,rgba(245,215,142,.16) 42%,transparent 68%);
    transform:translateX(0);opacity:0}
  .spotlight-layer.play{opacity:1}
  .spotlight-layer.play .spot-beam{
    animation:spotSweep var(--spot-ms) ease-in-out forwards}
  @keyframes spotSweep{
    0%{opacity:0;transform:translateX(0)}
    14%{opacity:1}
    100%{opacity:0;transform:translateX(160%)}
  }

  .top{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;
    width:min(1100px,100%);flex:0 0 auto;margin-bottom:.4vh}
  .owl-wrap{position:absolute;left:50%;top:78%;transform:translate(-50%,-50%) scale(.28);
    width:min(36vmin,220px);height:min(36vmin,220px);z-index:0;pointer-events:none;opacity:.85}
  .owl-wrap img{width:100%;height:100%;object-fit:contain;display:block;
    clip-path:circle(48% at 50% 50%)}
  .hero-core .hero-slang,.hero-core .wiz{position:relative;z-index:2}
  .owl-wrap.play{animation:owlBloom var(--owl-ms) cubic-bezier(.2,.85,.2,1) forwards;z-index:0}
  .owl-wrap.hold{transform:translate(-50%,-40%) scale(.92);opacity:1}
  .owl-wrap.play::before,.owl-wrap.hold::before{content:"";position:absolute;inset:-38%;border-radius:50%;z-index:-1;
    background:radial-gradient(circle,rgba(255,236,180,.8),rgba(245,215,142,.36) 36%,rgba(204,255,0,.18) 55%,transparent 74%);
    opacity:.9}
  .owl-wrap.play::before{animation:aura var(--owl-ms) ease-out forwards}
  @keyframes owlBloom{
    0%{transform:translate(-50%,-50%) scale(.28);opacity:.7}
    62%{transform:translate(-50%,-46%) scale(1.04);opacity:1}
    100%{transform:translate(-50%,-40%) scale(.92);opacity:1}
  }
  @keyframes aura{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.05)}100%{opacity:.9;transform:scale(1)}}

  .title-row{position:relative;z-index:20;display:flex;align-items:center;justify-content:center;width:100%}
  h1{position:relative;z-index:5;margin:0;font-size:clamp(32px,6.4vw,72px);line-height:.9;
    letter-spacing:.06em;font-weight:900;text-align:center;padding:0;white-space:nowrap;
    background:linear-gradient(180deg,#FFF8E0 0%,#F5D78E 38%,#C99A3E 55%,#F5D78E 72%,#FFF1C4 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 2px rgba(255,240,200,.9)) drop-shadow(0 3px 0 #6b4a12)}

  .replay{appearance:none;position:absolute;right:0;top:50%;transform:translateY(-50%);
    z-index:20;display:inline-flex;align-items:center;justify-content:center;gap:5px;
    border:0;margin:0;padding:7px 13px;border-radius:999px;cursor:pointer;
    font:800 12px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    letter-spacing:.08em;text-transform:uppercase;color:#1a1404;
    background:linear-gradient(180deg,#FFF3C8,var(--gold) 55%,var(--gold2));
    box-shadow:0 0 0 1px rgba(184,138,58,.65) inset,0 3px 8px rgba(0,0,0,.35);
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;pointer-events:auto}
  .replay:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
  .replay:active{transform:translateY(-50%) scale(.97)}

  .hint{margin:6px 0 2px;font-size:clamp(10px,2.4vw,13px);font-weight:600;letter-spacing:.04em;
    color:rgba(236,233,247,.78);text-align:center}

  .pills{position:relative;z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:5px 6px;
    width:min(980px,100%);margin:.4vh 0 .3vh;padding:0 2px}
  .pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;
    padding:5px 11px;font-size:clamp(10px,2.4vw,13px);letter-spacing:.08em;font-weight:900;
    color:#1a1404;background:linear-gradient(180deg,#FFF3C8,var(--gold) 55%,var(--gold2));
    box-shadow:0 0 0 1px rgba(184,138,58,.65) inset,0 3px 8px rgba(0,0,0,.35);
    text-transform:uppercase;white-space:nowrap}
  .pill.lime{color:#102000;background:linear-gradient(180deg,#F3FFB0,var(--lime) 60%,#9FCB00);
    box-shadow:0 0 0 1px rgba(80,120,0,.5) inset,0 3px 8px rgba(0,0,0,.35)}
  .pill.ink{color:var(--gold);background:#12162a;box-shadow:0 0 0 2px var(--gold) inset,0 3px 8px rgba(0,0,0,.35)}

  .sheet{position:relative;z-index:12;width:min(980px,100%);display:flex;flex-direction:column;gap:0.7vh;
    padding:0 2px 4px}
  .hero-band{display:grid;grid-template-columns:minmax(64px,1fr) auto minmax(64px,1fr);
    align-items:center;gap:6px 8px;width:100%}
  .side{display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:center}
  .hero-core{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
  .hero-slang{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  .rows{display:flex;flex-direction:column;gap:1.1vh}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;width:100%}
  .cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;min-width:0}

  button.wiz,button.slang{appearance:none;background:transparent;border:0;padding:0;margin:0;
    cursor:pointer;color:inherit;font:inherit;line-height:0;position:relative;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button.wiz:focus-visible,button.slang:focus-visible{outline:2px solid var(--lime);outline-offset:3px;border-radius:16px}
  button.wiz img,button.slang img{display:block;height:auto;opacity:1;max-width:100%;
    -webkit-touch-callout:none;user-select:none}
  button.wiz img{filter:drop-shadow(0 12px 12px rgba(0,0,0,.75))}
  button.wiz.hero img{width:min(38vw,22vh,280px);filter:drop-shadow(0 18px 16px rgba(0,0,0,.8))}
  button.wiz:not(.hero) img{width:min(22vw,14.5vh,168px)}
  button.slang img{width:min(12vw,8vh,84px);filter:drop-shadow(0 6px 8px rgba(0,0,0,.65))}
  button.slang.lg img{width:min(15vw,9.5vh,100px)}
  button.slang.sm img{width:min(10vw,7.2vh,72px)}
  .cell .slang,
  .cell:nth-child(2) .slang,
  .cell:nth-child(3) .slang{position:static;transform:none;top:auto;left:auto;right:auto;z-index:auto;order:1}
  .cell .wiz{order:2}
  .cell .tag,
  .cell:nth-child(2) .tag{position:static;left:auto;right:auto;bottom:auto;margin:0;z-index:auto;order:3;
    pointer-events:none;font-size:clamp(8px,1.8vw,11px);padding:3px 8px}

  body.is-swirl .wiz img,body.is-swirl .slang img{
    animation:swirlIn var(--swirl-ms) cubic-bezier(.15,.8,.2,1) both}
  body.is-swirl .cell:nth-child(1) img{animation-delay:.04s}
  body.is-swirl .cell:nth-child(2) img{animation-delay:.1s}
  body.is-swirl .cell:nth-child(3) img{animation-delay:.16s}
  @keyframes swirlIn{
    0%{transform:rotate(-420deg) scale(.18)}
    70%{transform:rotate(12deg) scale(1.05)}
    100%{transform:rotate(0) scale(1)}
  }
  body.is-graffiti .wiz img{animation:grafBump .4s ease-out both}
  @keyframes grafBump{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}

  /* Apple-style preview sheet */
  .preview[hidden]{display:none !important}
  .preview{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
    background:rgba(7,8,13,.55);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    backdrop-filter:blur(18px) saturate(1.4);
    opacity:0;pointer-events:none;transition:opacity .28s ease}
  .preview.open{opacity:1;pointer-events:auto}
  .preview-card{position:relative;width:min(440px,100%);background:rgba(28,28,32,.94);
    border-radius:28px;padding:48px 22px 22px;box-shadow:0 24px 60px rgba(0,0,0,.5);
    transform:translateY(16px) scale(.98);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .preview.open .preview-card{transform:none}
  .preview-close{appearance:none;position:absolute;top:12px;right:12px;width:40px;height:40px;
    border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;
    font:600 28px/1 -apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .preview-close:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
  .preview-card img{display:block;width:100%;max-height:54vh;object-fit:contain;margin:0 auto;
    -webkit-touch-callout:default;-webkit-user-select:none;user-select:none;
    filter:drop-shadow(0 16px 24px rgba(0,0,0,.45))}
  .preview-name{margin:14px 0 0;text-align:center;font-size:15px;font-weight:800;letter-spacing:.04em;
    color:#F5D78E}
  .preview-hint{margin:8px 0 0;text-align:center;font-size:13px;font-weight:600;color:rgba(236,233,247,.8);
    min-height:1.2em}
  .preview-hint[hidden]{display:none !important}
  .preview-share{appearance:none;display:block;width:100%;margin-top:16px;border:0;border-radius:14px;
    padding:16px 18px;font:800 17px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    letter-spacing:.01em;color:#102000;background:var(--lime);cursor:pointer;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .preview-share:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .preview-share:active{transform:scale(.98)}

  @media (max-width:700px){
    h1{font-size:clamp(26px,9.2vw,40px);padding:0}
    .replay{padding:6px 11px;font-size:11px}
    .hint{margin:4px 0 0;font-size:11px}
    .pills{gap:4px;margin:.35vh 0 .15vh}
    .pill{padding:4px 7px;font-size:9px;letter-spacing:.06em}
    .hero-band{grid-template-columns:minmax(52px,22vw) minmax(0,1fr) minmax(52px,22vw);gap:2px 4px}
    button.wiz.hero img{width:min(48vw,22vh,260px)}
    button.wiz:not(.hero) img{width:min(30vw,15vh,150px)}
    button.slang img{width:min(16vw,8.5vh,80px)}
    button.slang.lg img{width:min(18vw,9.5vh,90px)}
    button.slang.sm img{width:min(14vw,8vh,68px)}
    .row{gap:12px 4px}
    .rows{gap:1.6vh}

    .cell .slang img,
    .cell .slang.sm img{width:min(13vw,52px)}

    .hero-core{gap:12px}
    .hero-slang{position:relative;z-index:3;margin-bottom:8px}
    .owl-wrap{top:78%;width:min(36vmin,168px);height:min(36vmin,168px)}
    .owl-wrap.hold{transform:translate(-50%,-40%) scale(.92)}
    @keyframes owlBloom{
      0%{transform:translate(-50%,-50%) scale(.28);opacity:.7}
      62%{transform:translate(-50%,-46%) scale(1.02);opacity:1}
      100%{transform:translate(-50%,-40%) scale(.92);opacity:1}
    }
    .preview{align-items:flex-end}
    .preview-card{width:100%;border-radius:28px 28px 20px 20px;padding:48px 18px max(18px,env(safe-area-inset-bottom))}
  }
  @media (prefers-reduced-motion:reduce){
    .swirl-layer.play .swirl-ring,.graffiti-layer.play .graf-stroke,.spotlight-layer.play .spot-beam,
    .owl-wrap.play,.owl-wrap.play::before,body.is-swirl .wiz img,body.is-swirl .slang img,
    body.is-graffiti .wiz img,.preview,.preview-card{
      animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important}
  }
</style>

<body>
<div class="stage" id="stage">
  <div class="layer swirl-layer" id="swirl" aria-hidden="true">
    <span class="swirl-ring r1"></span><span class="swirl-ring r2"></span><span class="swirl-ring r3"></span>
  </div>
  <div class="layer graffiti-layer" id="graffiti" aria-hidden="true">
    <span class="graf-stroke g1"></span><span class="graf-stroke g2"></span>
    <span class="graf-stroke g3"></span><span class="graf-stroke g4"></span>
  </div>
  <div class="layer spotlight-layer" id="spotlight" aria-hidden="true">
    <span class="spot-beam"></span>
  </div>

  <header class="top">
    <div class="title-row">
      <h1>SOFT7 77</h1>
      <button type="button" class="replay" id="replay">Replay</button>
    </div>
    <p class="hint">Tap any sticker to save or share</p>
    <div class="pills" aria-hidden="true">
      <span class="pill">SAY LESS</span>
      <span class="pill lime">W</span>
      <span class="pill ink">7</span>
      <span class="pill">BRO.</span>
      <span class="pill lime">COOKED</span>
      <span class="pill ink">NPC</span>
      <span class="pill">LOCKED IN</span>
      <span class="pill ink">WAIT WHAT</span>
      <span class="pill lime">NO WAY</span>
      <span class="pill lime">BET</span>
    </div>
  </header>

  <div class="sheet" id="sheet">
    <div class="hero-band">
      <div class="side">
        <button class="slang lg" type="button" data-pop="../billy-stickers/01-reactions/say-less.gif" aria-label="SAY LESS">
          <img src="../billy-stickers/01-reactions/say-less.gif" width="408" height="408" alt="SAY LESS">
        </button>
        <button class="slang sm" type="button" data-pop="../billy-stickers/01-reactions/l.gif" aria-label="L">
          <img src="../billy-stickers/01-reactions/l.gif" width="408" height="408" alt="L">
        </button>
        <button class="slang sm" type="button" data-pop="../billy-stickers/01-reactions/third-eye.gif" aria-label="THIRD EYE">
          <img src="../billy-stickers/01-reactions/third-eye.gif" width="408" height="408" alt="THIRD EYE">
        </button>
      </div>
      <div class="hero-core">
        <div class="owl-wrap" id="owlBloom"><img src="billy-assets/owl.webp" width="512" height="512" alt=""></div>
        <div class="hero-slang">
          <button class="slang" type="button" data-pop="../billy-stickers/01-reactions/w.gif" aria-label="W">
            <img src="../billy-stickers/01-reactions/w.gif" width="408" height="408" alt="W">
          </button>
          <button class="slang" type="button" data-pop="../billy-stickers/01-reactions/seven.gif" aria-label="7">
            <img src="../billy-stickers/01-reactions/seven.gif" width="408" height="408" alt="7">
          </button>
          <button class="slang sm crown" type="button" data-pop="../billy-stickers/03-drop-two/05-glowing-crown.gif" aria-label="Crown">
            <img src="../billy-stickers/03-drop-two/05-glowing-crown.png" width="512" height="512" alt="">
          </button>
        </div>
        <button class="wiz hero" type="button" data-pop="billy-assets/soft7-77-001.webp" aria-label="Soft7 77 #001">
          <img class="soft7" src="billy-assets/soft7-77-001.webp" width="512" height="512" alt="Soft7 77 #001">
        </button>
      </div>
      <div class="side">
        <button class="slang" type="button" data-pop="../billy-stickers/03-drop-two/07-bet.gif" aria-label="BET">
          <img src="../billy-stickers/03-drop-two/07-bet.png" width="512" height="512" alt="BET">
        </button>
        <button class="slang" type="button" data-pop="../billy-stickers/03-drop-two/04-chill.gif" aria-label="CHILL">
          <img src="../billy-stickers/03-drop-two/04-chill.png" width="512" height="512" alt="CHILL">
        </button>
      </div>
    </div>

    <div class="rows">
      <div class="row">
        <div class="cell">
          <button class="slang sm" type="button" data-pop="../billy-stickers/01-reactions/bro.gif" aria-label="BRO.">
            <img src="../billy-stickers/01-reactions/bro.gif" width="408" height="408" alt="BRO.">
          </button>
          <button class="wiz" type="button" data-pop="billy-assets/soft7-77-002.webp" aria-label="Soft7 77 #002">
            <img class="soft7" src="billy-assets/soft7-77-002.webp" width="512" height="512" alt="Soft7 77 #002">
          </button>
        </div>
        <div class="cell">
          <button class="slang sm" type="button" data-pop="../billy-stickers/01-reactions/cooked.gif" aria-label="COOKED">
            <img src="../billy-stickers/01-reactions/cooked.gif" width="408" height="408" alt="COOKED">
          </button>
          <button class="wiz" type="button" data-pop="billy-assets/soft7-77-003.webp" aria-label="Soft7 77 #003">
            <img class="soft7" src="billy-assets/soft7-77-003.webp" width="512" height="512" alt="Soft7 77 #003">
          </button>

        <div class="cell">
          <button class="slang sm" type="button" data-pop="../billy-stickers/01-reactions/npc.gif" aria-label="NPC">
            <img src="../billy-stickers/01-reactions/npc.gif" width="408" height="408" alt="NPC">
          </button>
          <button class="wiz" type="button" data-pop="billy-assets/soft7-77-004.webp" aria-label="Soft7 77 #004">
            <img class="soft7" src="billy-assets/soft7-77-004.webp" width="512" height="512" alt="Soft7 77 #004">

      <div class="row">
        <div class="cell">
          <button class="slang sm" type="button" data-pop="../billy-stickers/03-drop-two/01-locked-in.gif" aria-label="LOCKED IN">
            <img src="../billy-stickers/03-drop-two/01-locked-in.png" width="512" height="512" alt="LOCKED IN">
          </button>
          <span class="pill tag">LOCKED IN</span>
          <button class="wiz" type="button" data-pop="billy-assets/soft7-77-005.webp" aria-label="Soft7 77 #005">
            <img class="soft7" src="billy-assets/soft7-77-005.webp" width="512" height="512" alt="Soft7 77 #005">
          </button>
        </div>
        <div class="cell">
          <button class="slang sm" type="button" data-pop="../billy-stickers/03-drop-two/02-wait-what.gif" aria-label="WAIT WHAT">
            <img src="../billy-stickers/03-drop-two/02-wait-what.png" width="512" height="512" alt="WAIT WHAT">
          </button>
          <span class="pill tag lime">WAIT WHAT</span>
          <button class="wiz" type="button" data-pop="billy-assets/soft7-77-006.webp" aria-label="Soft7 77 #006">
            <img class="soft7" src="billy-assets/soft7-77-006.webp" width="512" height="512" alt="Soft7 77 #006">
          </button>
        </div>
        <div class="cell">
          <button class="slang sm" type="button" data-pop="../billy-stickers/03-drop-two/03-no-way.gif" aria-label="NO WAY">
            <img src="../billy-stickers/03-drop-two/03-no-way.png" width="512" height="512" alt="NO WAY">
          </button>
          <span class="pill tag ink">NO WAY</span>
          <button class="wiz" type="button" data-pop="billy-assets/soft7-77-007.webp" aria-label="Soft7 77 #007">

<div class="preview" id="preview" hidden>
  <div class="preview-card" role="dialog" aria-modal="true" aria-labelledby="previewName">
    <button type="button" class="preview-close" id="previewClose" aria-label="Close">×</button>
    <img id="previewImg" alt="">
    <p class="preview-name" id="previewName"></p>
    <p class="preview-hint" id="previewHint" hidden>Press &amp; hold image to Save / Copy Sticker</p>
    <button type="button" class="preview-share" id="previewShare">Share / Save Sticker</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SWIRL = reduce ? 40 : 700;
  const GRAF = reduce ? 40 : 700;
  const SPOT = reduce ? 40 : 800;
  const OWL = reduce ? 40 : 800;
  const swirl = document.getElementById('swirl');
  const graffiti = document.getElementById('graffiti');
  const spotlight = document.getElementById('spotlight');
  const owl = document.getElementById('owlBloom');
  const preview = document.getElementById('preview');
  const previewCard = preview.querySelector('.preview-card');
  const previewImg = document.getElementById('previewImg');
  const previewName = document.getElementById('previewName');
  const previewHint = document.getElementById('previewHint');
  const previewShare = document.getElementById('previewShare');
  const previewClose = document.getElementById('previewClose');

  let timers = [];
  let gen = 0;
  let playing = false;
  let popOpen = false;
  let pendingFile = null;
  let closeTimer = 0;

  window.__billySeqLog = [];
  function seqLog(stage, event) {
    window.__billySeqLog.push({stage, t: performance.now(), event});
  }

  function clearTimers() {
    for (const t of timers) clearTimeout(t);
    timers = [];
    if (closeTimer) { clearTimeout(closeTimer); closeTimer = 0; }
  }

  function wait(ms, my) {
    return new Promise(resolve => {
      const t = setTimeout(() => {
        timers = timers.filter(x => x !== t);
        resolve(my === gen);
      }, ms);
      timers.push(t);
    });
  }

  function abortPlay() {
    gen += 1;
    playing = false;
    clearTimers();
    document.body.classList.remove('is-swirl','is-graffiti','is-spotlight','is-owl');
    swirl.classList.remove('play');
    graffiti.classList.remove('play');
    spotlight.classList.remove('play');
    owl.classList.remove('play','hold');
    void swirl.offsetWidth;
    void graffiti.offsetWidth;
    void spotlight.offsetWidth;
    void owl.offsetWidth;
  }

  function finishRest() {
    document.body.classList.remove('is-swirl','is-graffiti','is-spotlight','is-owl');
    swirl.classList.remove('play');
    graffiti.classList.remove('play');
    spotlight.classList.remove('play');
    owl.classList.remove('play');
    owl.classList.add('hold');
    playing = false;
  }

  async function playSeq() {
    abortPlay();
    const my = gen;
    window.__billySeqLog = [];
    playing = true;

    seqLog('swirl', 'start');
    document.body.classList.add('is-swirl');
    swirl.classList.add('play');
    if (!await wait(SWIRL, my)) return;
    seqLog('swirl', 'end');
    document.body.classList.remove('is-swirl');
    swirl.classList.remove('play');

    seqLog('graffiti', 'start');
    document.body.classList.add('is-graffiti');
    graffiti.classList.add('play');
    if (!await wait(GRAF, my)) return;
    seqLog('graffiti', 'end');
    document.body.classList.remove('is-graffiti');
    graffiti.classList.remove('play');

    seqLog('spotlight', 'start');
    document.body.classList.add('is-spotlight');
    spotlight.classList.add('play');
    if (!await wait(SPOT, my)) return;
    seqLog('spotlight', 'end');
    document.body.classList.remove('is-spotlight');
    spotlight.classList.remove('play');

    seqLog('owl_bloom', 'start');
    document.body.classList.add('is-owl');
    owl.classList.add('play');
    if (!await wait(OWL, my)) return;
    seqLog('owl_bloom', 'end');
    if (my !== gen) return;
    finishRest();
  }

  function slug(label) {
    const s = String(label || 'soft7-77-sticker').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return s || 'soft7-77-sticker';
  }

  async function toShareFile(blob, src, label) {
    const base = slug(label);
    const isGif = (blob && blob.type === 'image/gif') || /\.gif(\?|$)/i.test(src);
    if (isGif) return new File([blob], base + '.gif', {type: 'image/gif'});
    const isPng = (blob && blob.type === 'image/png') || /\.png(\?|$)/i.test(src);
    if (isPng) return new File([blob], base + '.png', {type: 'image/png'});
    try {
      const bmp = await createImageBitmap(blob);
      const c = document.createElement('canvas');
      c.width = bmp.width; c.height = bmp.height;
      c.getContext('2d').drawImage(bmp, 0, 0);
      if (bmp.close) bmp.close();
      const png = await new Promise((resolve, reject) => {
        c.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png');
      });
      return new File([png], base + '.png', {type: 'image/png'});
    } catch (err) {
      const ext = (blob && blob.type && blob.type.split('/')[1]) || 'webp';
      return new File([blob], base + '.' + ext, {type: (blob && blob.type) || 'image/webp'});
    }
  }

  async function prefetchShare(src, label) {
    pendingFile = null;
    try {
      const res = await fetch(src);
      if (!res.ok) return;
      const blob = await res.blob();
      pendingFile = await toShareFile(blob, src, label);
    } catch (err) {
      pendingFile = null;
    }
  }

  function showHint(text) {
    previewHint.hidden = false;
    previewHint.textContent = text;
  }

  function openPreview(src, label) {
    pendingFile = null;
    previewHint.hidden = true;
    previewImg.src = src;
    previewImg.alt = label || 'Sticker';
    previewName.textContent = label || 'Soft7 77';
    preview.hidden = false;
    requestAnimationFrame(() => preview.classList.add('open'));
    popOpen = true;
    previewClose.focus();
    prefetchShare(src, label);
  }

  function closePreview(immediate) {
    preview.classList.remove('open');
    popOpen = false;
    pendingFile = null;
    if (closeTimer) { clearTimeout(closeTimer); closeTimer = 0; }
    const hide = () => {
      if (!popOpen) {
        preview.hidden = true;
        preview.style.pointerEvents = '';
        previewImg.removeAttribute('src');
        previewHint.hidden = true;
      }
    };
    if (immediate) hide();
    else closeTimer = setTimeout(hide, 280);
  }

  document.querySelectorAll('button.wiz, button.slang').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.preventDefault();
      ev.stopPropagation();
      const src = btn.getAttribute('data-pop');
      const label = btn.getAttribute('aria-label') || '';
      if (src) openPreview(src, label);
    });
  });

  previewClose.addEventListener('click', ev => {
    ev.preventDefault();
    ev.stopPropagation();
    closePreview();
  });
  preview.addEventListener('click', ev => {
    if (ev.target === preview) closePreview();
  });
  previewCard.addEventListener('click', ev => ev.stopPropagation());
  addEventListener('keydown', e => { if (e.key === 'Escape' && popOpen) closePreview(); });

  previewShare.addEventListener('click', async ev => {
    ev.preventDefault();
    ev.stopPropagation();
    const title = previewName.textContent || 'Soft7 77 sticker';
    const src = previewImg.currentSrc || previewImg.src;
    try {
      if (!pendingFile && src) await prefetchShare(src, title);
      if (pendingFile && navigator.canShare && navigator.canShare({files: [pendingFile]})) {
        await navigator.share({files: [pendingFile], title, text: 'Soft7 77'});
        return;
      }
      if (typeof navigator.share === 'function') {
        const url = new URL(src, location.href).href;
        await navigator.share({title, url});
        return;
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
    try {
      if (pendingFile) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(pendingFile);
        a.download = pendingFile.name;
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2500);
      }
    } catch (err) {}
    showHint('Press & hold image to Save / Copy Sticker');
  });

  document.getElementById('replay').addEventListener('click', ev => {
    ev.preventDefault();
    ev.stopPropagation();
    if (popOpen) closePreview(true);
    playSeq();
  });

  function imagesReady() {
    const imgs = [...document.querySelectorAll('img.soft7')];
    const waitImgs = Promise.all(imgs.map(img => {
      if (img.decode) return img.decode().catch(() => {});
      if (img.complete && img.naturalWidth) return Promise.resolve();
      return new Promise(res => {
        img.addEventListener('load', res, {once: true});
        img.addEventListener('error', res, {once: true});
      });
    }));
    return Promise.race([waitImgs, wait(1200, gen)]);
  }

  function boot() {
    abortPlay();
    closePreview(true);
    imagesReady().then(() => playSeq());
  }

  addEventListener('pageshow', () => { boot(); });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      if (playing) {
        abortPlay();
        finishRest();
      } else {
        clearTimers();
      }
      if (preview.classList.contains('open') === false) {
        preview.hidden = true;
        preview.style.pointerEvents = '';
      }
    } else if (document.visibilityState === 'visible') {
      if (!preview.classList.contains('open')) {
        preview.hidden = true;
        preview.classList.remove('open');
        preview.style.pointerEvents = '';
        popOpen = false;
      }
    }
  });
})();
</script>
</body>
</html>
